// ─── Export PNG (theme-aware via CSS tokens) ──────────────────────────────────
function safeFilename(name) { return (name || 'unnamed').trim().replace(/[/\\:*?"<>|]/g, '_'); }
function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

// export palette: the journey's brand theme wins, missing roles fall back to app tokens
function exportPalette() {
  const t = currentBrandTheme();
  const c = (t && t.colors) || {};
  const pick = (role, token, fb) => c[role] || cssVar(token, fb);
  return {
    bg:         pick('bg',         '--bg',          '#ffffff'),
    stageBg:    pick('stageBg',    '--panel-3',     '#eaecef'),
    stageText:  pick('stageText',  '--text-2',      '#4b5563'),
    panel:      pick('stepBg',     '--panel',       '#ffffff'),
    panel2:     pick('labelBg',    '--panel-2',     '#f1f3f5'),
    labelText:  pick('labelText',  '--text-3',      '#5c6670'),
    cell:       pick('cellBg',     '--cell',        '#ffffff'),
    text:       pick('text',       '--text-2',      '#4b5563'),
    border:     pick('border',     '--border',      '#d0d7de'),
    borderSoft: pick('borderSoft', '--border-soft', '#e5e7eb'),
    accent:     pick('accent',     '--accent',      '#2563eb'),
  };
}

// layout plan for a stack of full-column-width screenshots (no bitmaps needed — uses metadata)
function shotDrawPlan(shots, availW, maxH) {
  const n = shots.length;
  if (!n) return null;
  const gap = 8;
  const places = shots.map(s => {
    const w = s.w || 1, h = s.h || 1;
    let dw = availW, dh = h * (availW / w);
    if (dh > maxH) { dh = maxH; dw = w * (maxH / h); }
    return { dw: Math.round(dw), dh: Math.round(dh) };
  });
  const contentH = Math.max(12, places.reduce((a, p) => a + p.dh, 0) + gap * (n - 1));
  return { gap, places, contentH };
}

async function exportPng() {
  const j = currentJourney(); if (!j) return;
  const flat = [];
  j.stages.forEach(st => st.steps.forEach(step => flat.push({ stage: st, step })));
  if (flat.length === 0) return;

  // pre-load screenshot bitmaps (missing blobs draw a dashed placeholder)
  const shotBmps = new Map();
  await Promise.all(flat.map(f => Promise.all(((f.step.cells || {})[SCREENSHOT_KEY] || []).map(async s => {
    try {
      const rec = await dbGetImage(s.id);
      if (!rec || !rec.blob) return;
      if (window.createImageBitmap) { shotBmps.set(s.id, await createImageBitmap(rec.blob)); }
      else { const img = await imgElementFromBlob(rec.blob); if (img) shotBmps.set(s.id, img); }
    } catch (e) { /* placeholder */ }
  }))));

  const C = exportPalette();
  const pad = 14, headerH = 30, stepHeaderH = 32, labelW = 170, colW = 440, lineH = 15, font = '12px -apple-system,Segoe UI,sans-serif';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = font;

  function wrapLines(text, maxW) {
    if (!text) return [];
    const words = String(text).split(/\s+/);
    const lines = []; let cur = '';
    words.forEach(w => {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  const sliceRows = SLICES.map(slice => {
    if (slice.key === SCREENSHOT_KEY) {
      let maxH = 0, any = false;
      flat.forEach(f => {
        const plan = shotDrawPlan((f.step.cells || {})[SCREENSHOT_KEY] || [], colW - 16, 360);
        if (plan) { any = true; maxH = Math.max(maxH, plan.contentH); }
      });
      return { slice, h: any ? maxH + 14 : 34 };
    }
    let maxLines = 1;
    flat.forEach(f => {
      if (slice.key === EMOTION_KEY) { maxLines = Math.max(maxLines, 1); return; }
      const list = f.step.cells[slice.key] || [];
      let n = 0;
      list.forEach(el => { n += Math.max(1, wrapLines(el.text, colW - 18).length); });
      if (list.length === 0) n = 1;
      maxLines = Math.max(maxLines, n);
    });
    return { slice, h: Math.max(34, maxLines * lineH + 14) };
  });

  const totalW = pad * 2 + labelW + colW * flat.length;
  const totalH = pad * 2 + headerH + stepHeaderH + sliceRows.reduce((a, r) => a + r.h, 0);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = totalW * dpr; canvas.height = totalH * dpr;
  canvas.style.width = totalW + 'px'; canvas.style.height = totalH + 'px';
  ctx.scale(dpr, dpr);
  ctx.font = font;

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, totalW, totalH);

  const x0 = pad, y0 = pad;
  ctx.fillStyle = C.accent; ctx.font = 'bold 14px -apple-system,Segoe UI,sans-serif';
  ctx.fillText(`${j.title}  ·  ${personaName(j.personaId)}`, x0, y0 + 16);
  ctx.font = font;

  let y = y0 + headerH;
  j.stages.forEach(st => {
    const first = flat.findIndex(f => f.stage === st);
    const lasts = []; for (let i = 0; i < flat.length; i++) if (flat[i].stage === st) lasts.push(i);
    const last = lasts[lasts.length - 1];
    const x1 = x0 + labelW + first * colW;
    ctx.fillStyle = C.stageBg; ctx.fillRect(x1, y, (last - first + 1) * colW, 22);
    ctx.fillStyle = C.stageText; ctx.font = 'bold 12px -apple-system,Segoe UI,sans-serif';
    ctx.fillText(st.name, x1 + 8, y + 15);
    ctx.font = font;
  });
  y += 22;

  flat.forEach((f, col) => {
    const x1 = x0 + labelW + col * colW;
    ctx.fillStyle = C.panel; ctx.fillRect(x1, y, colW, stepHeaderH);
    ctx.strokeStyle = C.border; ctx.strokeRect(x1, y, colW, stepHeaderH);
    ctx.fillStyle = C.text;
    ctx.fillText(trunc(ctx, f.step.name, colW - 12), x1 + 7, y + 20);
  });
  ctx.fillStyle = C.panel2; ctx.fillRect(x0, y, labelW, stepHeaderH);
  ctx.strokeStyle = C.border; ctx.strokeRect(x0, y, labelW, stepHeaderH);
  ctx.fillStyle = C.labelText; ctx.fillText('Step', x0 + 8, y + 20);
  y += stepHeaderH;

  sliceRows.forEach(({ slice, h }) => {
    ctx.fillStyle = C.panel2; ctx.fillRect(x0, y, labelW, h);
    ctx.strokeStyle = C.border; ctx.strokeRect(x0, y, labelW, h);
    ctx.fillStyle = C.labelText; ctx.font = 'bold 11px -apple-system,Segoe UI,sans-serif';
    ctx.fillText(slice.label, x0 + 8, y + 17);
    ctx.font = font;
    flat.forEach((f, col) => {
      const x1 = x0 + labelW + col * colW;
      ctx.fillStyle = C.cell; ctx.fillRect(x1, y, colW, h);
      ctx.strokeStyle = C.borderSoft; ctx.strokeRect(x1, y, colW, h);
      if (slice.key === EMOTION_KEY) {
        const v = f.step.cells[EMOTION_KEY];
        if (v != null) {
          ctx.fillStyle = EMO_COLORS[v - 1];
          for (let k = 0; k < v; k++) { ctx.beginPath(); ctx.arc(x1 + 12 + k * 16, y + h / 2, 5, 0, Math.PI * 2); ctx.fill(); }
        } else { ctx.fillStyle = C.labelText; ctx.fillText('—', x1 + 8, y + h / 2 + 4); }
      } else if (slice.key === SCREENSHOT_KEY) {
        const shots = (f.step.cells || {})[SCREENSHOT_KEY] || [];
        if (shots.length === 0) { ctx.fillStyle = C.labelText; ctx.fillText('—', x1 + 8, y + 17); }
        else {
          const availW = colW - 16;
          const plan = shotDrawPlan(shots, availW, 360);
          let dy = y + 7;
          shots.forEach((s, k) => {
            const { dw, dh } = plan.places[k];
            const dx = x1 + 8 + (availW - dw) / 2;
            const bm = shotBmps.get(s.id);
            if (bm) { try { ctx.drawImage(bm, dx, dy, dw, dh); } catch (err) { /* skip */ } }
            else {
              ctx.setLineDash([4, 3]);
              ctx.strokeStyle = C.border;
              ctx.strokeRect(dx, dy, dw, dh);
              ctx.setLineDash([]);
            }
            ctx.strokeStyle = C.borderSoft;
            ctx.strokeRect(dx + 0.5, dy + 0.5, dw - 1, dh - 1);
            dy += dh + plan.gap;
          });
        }
      } else {
        const list = f.step.cells[slice.key] || [];
        let ty = y + 16;
        list.forEach(el => {
          const lines = wrapLines(elementText(el, slice.key), colW - 18) || [''];
          ctx.fillStyle = C.text;
          lines.forEach(ln => { ctx.fillText(ln, x1 + 8, ty); ty += lineH; });
          ty += 2;
        });
        if (list.length === 0) { ctx.fillStyle = C.labelText; ctx.fillText('—', x1 + 8, y + 17); }
      }
    });
    y += h;
  });

  canvas.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${safeFilename(j.title)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    btnExport.textContent = '✓ Saved';
    setTimeout(() => { btnExport.textContent = '↓ Export PNG'; }, 1500);
    shotBmps.forEach(bm => { if (bm.close) bm.close(); });
  }, 'image/png');
}

function trunc(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

// ─── Export / Import JSON ─────────────────────────────────────────────────────
function dateStamp() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
}
function downloadJson(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function stepsOfJourney(j, into) {
  ((j && j.stages) || []).forEach(st => ((st && st.steps) || []).forEach(step => into.push(step)));
  return into;
}
async function exportImagesForSteps(steps) {
  const out = [];
  for (const step of steps) {
    for (const s of ((step.cells || {})[SCREENSHOT_KEY] || [])) {
      try {
        const rec = await dbGetImage(s.id);
        if (!rec || !rec.blob) continue;
        out.push({ id: s.id, name: rec.name || 'screenshot', type: rec.type || rec.blob.type || 'image/png', w: s.w, h: s.h, data: await blobToDataURL(rec.blob) });
      } catch (e) { /* skip missing */ }
    }
  }
  return out;
}
async function exportDatabase() {
  const steps = [];
  state.categories.forEach(cat => (cat.journeys || []).forEach(j => stepsOfJourney(j, steps)));
  const images = await exportImagesForSteps(steps);
  const data = { version: 1, kind: 'database', app: 'customer-journey',
    categories: JSON.parse(JSON.stringify(state.categories)),
    personas: JSON.parse(JSON.stringify(state.personas)),
    brandThemes: JSON.parse(JSON.stringify(state.brandThemes)),
    images };
  downloadJson(data, 'customer-journey-backup-' + dateStamp() + '.json');
  flashToast('✓ Database exported');
}
async function exportJourney() {
  const j = currentJourney(); if (!j) return;
  const images = await exportImagesForSteps(stepsOfJourney(j, []));
  let persona = null;
  if (j.personaId != null) {
    const p = state.personas.find(x => x.id === j.personaId);
    if (p) persona = normalizePersona(JSON.parse(JSON.stringify(p)));
  }
  let theme = null;
  if (j.brandThemeId != null) {
    const t = state.brandThemes.find(x => x.id === j.brandThemeId);
    if (t) theme = { name: t.name };
  }
  const data = { version: 1, kind: 'journey', app: 'customer-journey',
    journey: JSON.parse(JSON.stringify(j)), persona, theme, images };
  downloadJson(data, safeFilename(j.title) + '.json');
  flashToast('✓ Journey exported');
}

function normalizeStep(step, idx) {
  if (!step.name) step.name = `Step ${(idx ?? 0) + 1}`;
  const c = step.cells || (step.cells = {});
  SLICES.forEach(s => { if (!(s.key in c)) c[s.key] = (s.key === EMOTION_KEY) ? null : []; });
}
function normalizeJourney(j) {
  if (!j || typeof j !== 'object') j = {};
  if (!j.title) j.title = 'Imported journey';
  if (j.description == null) j.description = '';
  if (j.expectations == null) j.expectations = '';
  if (j.brandThemeId == null) j.brandThemeId = null;
  if (!Array.isArray(j.stages)) j.stages = [];
  j.stages.forEach((st, si) => {
    if (!st.name) st.name = `Stage ${si + 1}`;
    if (!Array.isArray(st.steps)) st.steps = [];
    st.steps.forEach((step, ti) => normalizeStep(step, ti));
  });
}
function regenElementIds(list) { if (Array.isArray(list)) list.forEach(e => { e.id = uid(); }); }
function regenStep(step) { step.id = uid(); SLICES.forEach(s => { if (s.key !== EMOTION_KEY) regenElementIds(step.cells?.[s.key]); }); }
function regenStage(st) { st.id = uid(); (st.steps || []).forEach(regenStep); }
function regenJourney(j) { j.id = uid(); (j.stages || []).forEach(regenStage); }

async function importImagesIntoDb(data, steps) {
  const imgs = Array.isArray(data && data.images) ? data.images : [];
  if (imgs.length === 0 || steps.length === 0) return;
  const map = new Map();
  for (const rec of imgs) {
    if (!rec || rec.id == null || typeof rec.data !== 'string') continue;
    const blob = dataURLToBlob(rec.data);
    if (!blob) continue;
    const newId = uid();
    try {
      await dbPutImage({ id: newId, blob, type: rec.type || blob.type, name: rec.name || 'screenshot', w: rec.w || 0, h: rec.h || 0 });
      map.set(rec.id, newId);
    } catch (e) { console.error(e); }
  }
  if (map.size === 0) return;
  steps.forEach(step => {
    const list = (step.cells || {})[SCREENSHOT_KEY];
    if (!Array.isArray(list)) return;
    step.cells[SCREENSHOT_KEY] = list.filter(s => map.has(s.id)).map(s => ({ id: map.get(s.id), w: s.w, h: s.h }));
  });
}
function importPersonas(data) {
  const list = Array.isArray(data.personas) ? data.personas : [];
  let added = 0, updated = 0;
  const seen = new Set();
  list.forEach(src => {
    if (!src || typeof src !== 'object' || typeof src.name !== 'string' || !src.name.trim()) return;
    const name = src.name.trim();
    const key = name.toLowerCase();
    if (seen.has(key)) return; // duplicate names in one file — first wins
    seen.add(key);
    let p = state.personas.find(x => x.name.trim().toLowerCase() === key);
    if (!p) { p = newPersona(name); state.personas.push(p); added++; }
    else updated++;
    if (typeof src.role === 'string' && src.role.trim()) p.role = src.role.trim();
    if (typeof src.description === 'string' && src.description.trim()) p.description = src.description.trim();
    if (typeof src.quote === 'string' && src.quote.trim()) p.quote = src.quote.trim();
    const g = normStrList(src.goals);       if (g) p.goals = g;
    const n = normStrList(src.needs);       if (n) p.needs = n;
    const f = normStrList(src.frustrations); if (f) p.frustrations = f;
  });
  save(); render();
  return { added, updated };
}
async function importDatabase(data) {
  // replace-all → delete every existing screenshot blob first
  const oldIds = [];
  state.categories.forEach(cat => (cat.journeys || []).forEach(j => collectJourneyShotIds(j).forEach(id => oldIds.push(id))));
  deleteShotIds(oldIds);
  const personas = Array.isArray(data.personas) ? data.personas : [];
  personas.forEach(p => normalizePersona(p));
  const personaMap = {};
  personas.forEach(p => { const old = p.id; p.id = uid(); personaMap[old] = p.id; });
  // themes: regen ids + remap journey refs; a backup without brandThemes keeps the current set
  const themes = Array.isArray(data.brandThemes)
    ? data.brandThemes.map(t => normalizeBrandTheme({ ...t })).filter(Boolean)
    : state.brandThemes;
  const themeMap = {};
  themes.forEach(t => { const old = t.id; t.id = uid(); themeMap[old] = t.id; });
  const categories = Array.isArray(data.categories) ? data.categories : [];
  const steps = [];
  categories.forEach(cat => {
    cat.id = uid();
    (cat.journeys || []).forEach(j => {
      normalizeJourney(j); regenJourney(j);
      stepsOfJourney(j, steps);
      j.personaId = (j.personaId != null && personaMap[j.personaId] != null) ? personaMap[j.personaId] : null;
      j.brandThemeId = (j.brandThemeId != null && themeMap[j.brandThemeId] != null) ? themeMap[j.brandThemeId] : null;
    });
  });
  // touchpoint library: resolve old free-text backups into per-category libraries
  categories.forEach(cat => migrateCategoryTouchpoints(cat));
  await importImagesIntoDb(data, steps);
  state.categories = categories;
  state.personas = personas;
  state.brandThemes = themes;
  state.activeCategory = 0; state.activeJourney = 0;
  _activeShotsCell = null;
  ensureActiveIndicesValid();
  save(); render();
}
async function importJourney(data) {
  let cat = currentCategory();
  if (!cat) { cat = newCategory('Cash loan'); state.categories.push(cat); state.activeCategory = state.categories.length - 1; state.activeJourney = 0; }
  let personaId = null;
  if (data.persona && data.persona.name) {
    let p = state.personas.find(x => x.name.trim().toLowerCase() === String(data.persona.name).trim().toLowerCase());
    if (!p) { p = newPersona(String(data.persona.name)); state.personas.push(p); }
    // fill fields from the snapshot (import wins over empty local)
    const sp = normalizePersona({ ...data.persona });
    if (sp.role && !p.role) p.role = sp.role;
    if (sp.description && !p.description) p.description = sp.description;
    if (sp.quote && !p.quote) p.quote = sp.quote;
    if (sp.goals.length && !p.goals.length) p.goals = sp.goals;
    if (sp.needs.length && !p.needs.length) p.needs = sp.needs;
    if (sp.frustrations.length && !p.frustrations.length) p.frustrations = sp.frustrations;
    personaId = p.id;
  } else if (state.personas[0]) personaId = state.personas[0].id;
  let brandThemeId = null;
  if (data.theme && data.theme.name) {
    const t = state.brandThemes.find(x => x.name.trim().toLowerCase() === String(data.theme.name).trim().toLowerCase());
    if (t) brandThemeId = t.id;
  }
  const j = data.journey || data;
  normalizeJourney(j); regenJourney(j);
  j.personaId = personaId;
  j.brandThemeId = brandThemeId;
  await importImagesIntoDb(data, stepsOfJourney(j, []));
  cat.journeys.push(j);
  state.activeJourney = cat.journeys.length - 1;
  save(); render();
}
function importFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { (async () => {
    let data;
    try { data = JSON.parse(e.target.result); } catch (err) { flashToast('✗ Invalid file'); return; }
    try {
      if (data && (data.kind === 'database' || Array.isArray(data.categories))) {
        if (!confirm('Replace ALL data with this imported file? This cannot be undone.')) { flashToast('Import cancelled'); return; }
        await importDatabase(data);
        const nj = state.categories.reduce((a, c) => a + (c.journeys?.length || 0), 0);
        flashToast(`✓ Imported (${nj} journeys)`);
      } else if (data && data.kind === 'personas' && Array.isArray(data.personas)) {
        const r = importPersonas(data);
        flashToast(`✓ Personas imported (${r.added} added, ${r.updated} updated)`);
      } else if (data && (data.kind === 'themes' || Array.isArray(data.themes) ||
                 (Array.isArray(data) && data.length > 0 && data.every(t => t && typeof t === 'object' && typeof t.name === 'string')))) {
        const r = importBrandThemes(data);
        flashToast(`✓ Themes imported (${r.added} added, ${r.updated} updated)`);
      } else if (data && (data.kind === 'journey' || data.journey || Array.isArray(data.stages))) {
        await importJourney(data);
        flashToast('✓ Journey imported');
      } else {
        flashToast('✗ Invalid file');
      }
    } catch (err) { console.error(err); flashToast('✗ Invalid file'); }
  })(); };
  reader.onerror = () => flashToast('✗ Invalid file');
  reader.readAsText(file);
}

let _toastTimer = null;
function flashToast(msg) {
  let el = document.getElementById('app-toast');
  if (!el) {
    el = document.createElement('div'); el.id = 'app-toast';
    el.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;z-index:9999;box-shadow:var(--shadow);max-width:90vw;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
  el.style.display = '';
}

document.addEventListener('paste', onPasteImage);

// sidebar resize
const SB_MIN = 160, SB_MAX = 420;
sidebarResizer.addEventListener('mousedown', e => {
  e.preventDefault();
  const startX = e.clientX, startW = sidebar.offsetWidth;
  sidebarResizer.classList.add('resizing');
  function onMove(ev) {
    const w = Math.min(SB_MAX, Math.max(SB_MIN, startW + ev.clientX - startX));
    sidebar.style.width = w + 'px';
  }
  function onUp() {
    sidebarResizer.classList.remove('resizing');
    state.sidebarWidth = sidebar.offsetWidth;
    save();
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  await load();
  if (state.categories.length === 0) {
    const cat = newCategory('Cash loan');
    const persona = newPersona('Anna');
    state.personas.push(persona);
    const j = newJourney('Cash loan application', persona.id);
    j.description = 'Submitting a loan application';
    cat.journeys.push(j);
    state.categories.push(cat);
    save();
  }
  ensureActiveIndicesValid();
  applyTheme();
  sidebar.style.width = (state.sidebarWidth || 220) + 'px';
  render();
})();
