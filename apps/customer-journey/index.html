<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Journey</title>
<style>
  /* ── Theme tokens ── */
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --panel-3: #eaecef;
    --inset: #ffffff;
    --border: #d0d7de;
    --border-soft: #e5e7eb;
    --text: #1f2328;
    --text-2: #4b5563;
    --text-3: #5c6670;
    --text-4: #626a73;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-contrast: #ffffff;
    --accent-soft: rgba(37,99,235,0.12);
    --accent-soft-text: #2563eb;
    --danger: #d1242f;
    --danger-soft: rgba(209,36,47,0.10);
    --chip: #eaecef;
    --chip-text: #57606a;
    --cell: #ffffff;
    --cell-hover: #f6f8fa;
    --element-bg: #f6f8fa;
    --element-border: #e1e4e8;
    --element-hover-bg: #eef0f2;
    --scrollbar: #c8d0d8;
    --shadow: 0 1px 2px rgba(31,35,40,0.06);
  }
  [data-theme="dark"] {
    --bg: #111;
    --panel: #141414;
    --panel-2: #161616;
    --panel-3: #1a1a1a;
    --inset: #1a1a1a;
    --border: #2a2a2a;
    --border-soft: #1e1e1e;
    --text: #e0e0e0;
    --text-2: #b9bfc6;
    --text-3: #9aa0a6;
    --text-4: #8a9098;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-contrast: #fff;
    --accent-soft: rgba(59,130,246,0.10);
    --accent-soft-text: #60a5fa;
    --danger: #f43f5e;
    --danger-soft: rgba(244,63,94,0.10);
    --chip: #2a2a2a;
    --chip-text: #a8aeb6;
    --cell: #111;
    --cell-hover: #161616;
    --element-bg: #1a1a1a;
    --element-border: #262626;
    --element-hover-bg: #1e1e1e;
    --scrollbar: #2a2a2a;
    --shadow: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: transparent; border: none; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--panel-3);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
  header .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--text-3); }

  .btn { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { color: var(--text-2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--panel-2); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Main layout ── */
  main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-4); flex-shrink: 0;
  }
  .sidebar-section-header .btn-add { cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; border-radius: 3px; color: var(--text-4); }
  .sidebar-section-header .btn-add:hover { color: var(--text-2); background: var(--panel-2); }

  .sb-list { list-style: none; overflow-y: auto; flex-shrink: 0; }
  #category-list { border-bottom: 1px solid var(--border-soft); max-height: 32%; }
  #persona-list   { border-bottom: 1px solid var(--border-soft); max-height: 26%; }
  #journey-list   { flex: 1; overflow-y: auto; }

  .sb-item { display: flex; align-items: flex-start; padding: 5px 10px; font-size: 12px; color: var(--text-3); cursor: pointer; gap: 6px; }
  .sb-item:hover { background: var(--cell-hover); color: var(--text-2); }
  .sb-item.active { background: var(--accent-soft); color: var(--text); }
  .sb-item .item-main { flex: 1; min-width: 0; }
  .sb-item .item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-item .item-sub { font-size: 10.5px; color: var(--text-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .sb-item .item-count { background: var(--chip); border-radius: 10px; padding: 0 6px; font-size: 10px; color: var(--chip-text); margin-left: 4px; flex-shrink: 0; }
  .sb-item input.rename-input { width: 100%; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; }

  .sb-item .item-edit, .sb-item .item-remove {
    opacity: 0; cursor: pointer; flex-shrink: 0; line-height: 1; padding: 2px 3px; border-radius: 3px; font-size: 11px; user-select: none;
  }
  .sb-item .drag-handle { opacity: 0; color: var(--text-4); flex-shrink: 0; line-height: 1; padding: 2px 3px; border-radius: 3px; font-size: 11px; user-select: none; cursor: grab; }
  .sb-item:hover .item-edit, .sb-item:hover .item-remove, .sb-item:hover .drag-handle { opacity: 1; }
  .sb-item .item-edit:hover { color: var(--accent-soft-text); background: var(--accent-soft); }
  .sb-item .item-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .sb-item.dragging { opacity: 0.35; }
  .sb-item.drag-over-above { border-top: 2px solid var(--accent); }
  .sb-item.drag-over-below { border-bottom: 2px solid var(--accent); }

  /* Sidebar resize handle */
  #sidebar-resizer { width: 4px; flex-shrink: 0; background: var(--border); cursor: ew-resize; transition: background 0.15s; }
  #sidebar-resizer:hover, #sidebar-resizer.resizing { background: var(--accent); }

  /* Scrollbars */
  .sb-list::-webkit-scrollbar, #grid-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .sb-list::-webkit-scrollbar-track, #grid-scroll::-webkit-scrollbar-track { background: transparent; }
  .sb-list::-webkit-scrollbar-thumb, #grid-scroll::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  /* ── Main panel ── */
  .panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 8px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-4); background: var(--panel-2); border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-header .count { background: var(--chip); border-radius: 10px; padding: 1px 7px; font-size: 11px; color: var(--chip-text); text-transform: none; }

  /* Journey metadata bar */
  #journey-meta { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  #journey-meta .meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #journey-meta .title-input { background: var(--inset); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 14px; font-weight: 600; padding: 5px 9px; outline: none; flex: 1; min-width: 180px; }
  #journey-meta .title-input:focus { border-color: var(--accent); }
  #journey-meta select, #journey-meta .field-input {
    background: var(--inset); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 12px; padding: 4px 8px; outline: none;
  }
  #journey-meta select:focus, #journey-meta .field-input:focus { border-color: var(--accent); }
  #journey-meta .field-input { flex: 1; min-width: 160px; }
  #journey-meta .field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-4); }

  /* ── Grid ── */
  #grid-scroll { flex: 1; overflow: auto; padding: 0; background: var(--bg); }
  #grid { display: grid; align-content: start; }
  .grow { display: contents; }

  .g-corner { background: var(--panel-2); position: sticky; left: 0; z-index: 4; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .g-corner.row-step { display: flex; align-items: center; padding: 0 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-4); }

  /* Stage header cell (spans its steps) */
  .g-stage {
    background: var(--panel-3); border: 1px solid var(--border); border-bottom: none;
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 30px;
  }
  .g-stage .drag-handle { color: var(--text-4); cursor: grab; font-size: 12px; user-select: none; }
  .g-stage:hover .drag-handle { color: var(--text-3); }
  .g-stage .stage-name { font-size: 12px; font-weight: 600; color: var(--text-2); flex: 1; cursor: text; padding: 1px 3px; border-radius: 3px; }
  .g-stage .stage-name:hover { background: var(--panel-2); }
  .g-stage input.rename-input { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; }
  .g-stage .stage-add-step { cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; border-radius: 3px; color: var(--text-4); }
  .g-stage .stage-add-step:hover { color: var(--accent-soft-text); background: var(--accent-soft); }
  .g-stage.dragging { opacity: 0.4; }
  .g-stage.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
  .g-stage.drop-after  { box-shadow: inset -3px 0 0 var(--accent); }

  /* Step header cell */
  .g-step {
    background: var(--panel); border: 1px solid var(--border); border-bottom: none;
    display: flex; align-items: center; gap: 4px; padding: 4px 6px; min-height: 34px; cursor: grab;
  }
  .g-step .step-name { font-size: 12px; color: var(--text-2); flex: 1; cursor: text; padding: 1px 3px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-step .step-name:hover { background: var(--panel-2); color: var(--text); }
  .g-step input.rename-input { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; min-width: 0; }
  .g-step .step-remove { opacity: 0; cursor: pointer; font-size: 12px; padding: 0 3px; border-radius: 3px; color: var(--text-4); }
  .g-step:hover .step-remove { opacity: 1; }
  .g-step .step-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .g-step.dragging { opacity: 0.35; }
  .g-step.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
  .g-step.drop-after  { box-shadow: inset -3px 0 0 var(--accent); }

  /* Slice label cell (sticky left) */
  .g-slice-label {
    background: var(--panel-2); position: sticky; left: 0; z-index: 3;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; padding: 0 12px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3);
  }

  /* Data cell */
  .g-cell {
    background: var(--cell); border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft);
    padding: 6px 7px; min-height: 56px; display: flex; flex-direction: column; gap: 4px; position: relative;
  }
  .g-cell:hover { background: var(--cell-hover); }
  .g-cell .element {
    display: flex; align-items: flex-start; gap: 4px;
    background: var(--element-bg); border: 1px solid var(--element-border); border-radius: 4px; padding: 3px 5px;
  }
  .g-cell .element:hover { border-color: var(--border); background: var(--element-hover-bg); }
  .g-cell .element .el-text { flex: 1; font-size: 11.5px; color: var(--text-2); line-height: 1.35; cursor: text; word-break: break-word; white-space: pre-wrap; }
  .g-cell .element .el-text:empty::before { content: '…'; color: var(--text-4); }
  .g-cell .element input.el-edit { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 11.5px; padding: 1px 4px; outline: none; }
  .g-cell .element .el-handle { color: var(--text-4); cursor: grab; font-size: 10px; line-height: 1.4; user-select: none; opacity: 0; }
  .g-cell .element:hover .el-handle { opacity: 1; }
  .g-cell .element .el-remove { color: var(--text-4); cursor: pointer; font-size: 11px; line-height: 1.4; opacity: 0; }
  .g-cell .element:hover .el-remove { opacity: 1; }
  .g-cell .element .el-remove:hover { color: var(--danger); }
  .g-cell .element.dragging { opacity: 0.35; }
  .g-cell .add-element { align-self: flex-start; border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; font-size: 11px; padding: 2px 7px; color: var(--text-4); }
  .g-cell .add-element:hover { border-color: var(--accent); color: var(--accent-soft-text); }

  /* Emotion cell */
  .g-cell.emotion-cell { justify-content: center; }
  .emo-dots { display: flex; gap: 5px; align-items: center; justify-content: center; }
  .emo-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--chip); cursor: pointer; border: 1px solid var(--border); padding: 0; }
  .emo-dot.on { background: var(--emo, var(--accent)); border-color: var(--emo, var(--accent)); }
  .emo-clear { font-size: 10px; color: var(--text-4); cursor: pointer; margin-left: 6px; }
  .emo-clear:hover { color: var(--danger); }

  /* Empty states */
  .empty-state { border: 2px dashed var(--border); border-radius: 12px; padding: 50px 40px; text-align: center; margin: 24px; }
  .empty-state p { font-size: 14px; color: var(--text-3); margin-bottom: 6px; }
  .empty-state small { font-size: 12px; color: var(--text-4); }
  .empty-state .btn { margin-top: 14px; }

  .sb-empty { padding: 10px 12px; font-size: 11px; color: var(--text-4); }

  /* storage error toast */
  #storage-error { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 10px 16px; font-size: 12px; z-index: 9999; max-width: 90vw; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Customer Journey</h1>
  <span class="hint">Customer journey map · stages / steps × slices</span>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-sm" id="btn-theme" aria-label="Switch theme" title="Switch theme">☀</button>
  <button class="btn btn-ghost btn-sm" id="btn-import" aria-label="Import JSON" title="Import JSON (full DB or single journey)">↥ Import</button>
  <button class="btn btn-ghost btn-sm" id="btn-export-json" aria-label="Export whole database as JSON" title="Export whole database as JSON">↧ Export JSON</button>
  <button class="btn btn-primary btn-sm" id="btn-export">↓ Export PNG</button>
  <input type="file" id="import-file" accept="application/json,.json" style="display:none">
</header>

<main>
  <!-- SIDEBAR -->
  <aside id="sidebar" aria-label="Library">
    <div class="sidebar-section-header">
      Categories
      <button class="btn-add" id="btn-add-category" aria-label="New category" title="New category">+</button>
    </div>
    <ul id="category-list" class="sb-list"></ul>

    <div class="sidebar-section-header">
      Personas
      <button class="btn-add" id="btn-add-persona" aria-label="New persona" title="New persona">+</button>
    </div>
    <ul id="persona-list" class="sb-list"></ul>

    <div class="sidebar-section-header">
      Customer journeys
      <button class="btn-add" id="btn-add-journey" aria-label="New journey" title="New journey">+</button>
    </div>
    <ul id="journey-list" class="sb-list"></ul>
  </aside>

  <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize library"></div>

  <!-- MAIN PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span id="panel-title">Customer journey</span>
      <span class="count" id="step-count">0 steps</span>
    </div>
    <div id="journey-meta" style="display:none"></div>
    <div id="grid-scroll">
      <div id="grid-empty" class="empty-state" style="display:none">
        <p>No customer journey</p>
        <small>Add a category and your first journey to start mapping.</small>
        <div><button class="btn btn-primary btn-sm" id="btn-empty-add">Add customer journey</button></div>
      </div>
      <div id="grid" role="grid" aria-label="Customer journey grid"></div>
    </div>
  </div>
</main>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'ux-customer-journey_v1';
const LABEL_COL_W = 150;
const STEP_COL_W  = 220;

const SLICES = [
  { key: 'action',     label: 'Actions' },
  { key: 'touchpoint', label: 'Touchpoints' },
  { key: 'mindset',    label: 'Mindset' },
  { key: 'emotion',    label: 'Emotions' },
  { key: 'pain-point', label: 'Pain points' },
  { key: 'idea',       label: 'Ideas' },
  { key: 'insight',    label: 'Insights' },
];
const EMOTION_KEY = 'emotion';
const EMO_COLORS = ['#f43f5e', '#f97316', '#eab308', '#84cc16', '#22c55e']; // 1..5 low→high

// ─── State ────────────────────────────────────────────────────────────────────
const state = {
  categories: [],
  personas: [],
  activeCategory: 0,
  activeJourney: 0,
  sidebarWidth: 220,
  theme: 'light',   // 'light' | 'dark' | 'auto'
  nextId: 1,
};

function uid() { return state.nextId++; }

function freshCells() {
  const c = {};
  SLICES.forEach(s => c[s.key] = (s.key === EMOTION_KEY) ? null : []);
  return c;
}
function newStep(name) { return { id: uid(), name, cells: freshCells() }; }
function newStage(name) { return { id: uid(), name, steps: [newStep('Step 1')] }; }
function newJourney(title, personaId) {
  return { id: uid(), personaId: personaId ?? null, title, description: '', expectations: '', stages: [newStage('Stage 1')] };
}
function newCategory(name) { return { id: uid(), name, journeys: [] }; }
function newPersona(name) { return { id: uid(), name }; }

function currentCategory() { return state.categories[state.activeCategory] ?? null; }
function currentJourney() { return currentCategory()?.journeys[state.activeJourney] ?? null; }
function personaName(id) { return state.personas.find(p => p.id === id)?.name ?? '—'; }

function ensureActiveIndicesValid() {
  if (state.categories.length === 0) return;
  state.activeCategory = Math.max(0, Math.min(state.activeCategory, state.categories.length - 1));
  const cat = currentCategory();
  if (cat) state.activeJourney = Math.max(0, Math.min(state.activeJourney, cat.journeys.length - 1));
}

function findStage(stageId) {
  const j = currentJourney(); if (!j) return null;
  for (let si = 0; si < j.stages.length; si++) {
    if (j.stages[si].id === stageId) return { stage: j.stages[si], stageIndex: si };
  }
  return null;
}
function findStep(stepId) {
  const j = currentJourney(); if (!j) return null;
  for (let si = 0; si < j.stages.length; si++) {
    const st = j.stages[si];
    for (let ti = 0; ti < st.steps.length; ti++) {
      if (st.steps[ti].id === stepId) return { stage: st, step: st.steps[ti], stageIndex: si, stepIndex: ti };
    }
  }
  return null;
}

// ─── Theme ────────────────────────────────────────────────────────────────────
const THEME_ORDER = ['light', 'dark', 'auto'];
const THEME_ICON = { light: '☀', dark: '☾', auto: '◐' };
const THEME_LABEL = { light: 'Light theme', dark: 'Dark theme', auto: 'Auto (follow system)' };
let _mqListener = null;

function resolveTheme() {
  if (state.theme === 'auto') {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  return state.theme;
}
function applyTheme() {
  const resolved = resolveTheme();
  document.documentElement.setAttribute('data-theme', resolved);
  const btn = document.getElementById('btn-theme');
  if (btn) {
    btn.textContent = THEME_ICON[state.theme] || '☀';
    btn.setAttribute('aria-label', THEME_LABEL[state.theme]);
    btn.title = THEME_LABEL[state.theme];
  }
  // react to system changes only in auto
  if (_mqListener) { window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change', _mqListener); _mqListener = null; }
  if (state.theme === 'auto' && window.matchMedia) {
    _mqListener = () => applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', _mqListener);
  }
}
function toggleTheme() {
  const idx = THEME_ORDER.indexOf(state.theme);
  state.theme = THEME_ORDER[(idx + 1) % THEME_ORDER.length];
  save(); applyTheme();
}

// ─── Persistence ──────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { showStorageError(); }
}

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    Object.assign(state, parsed);
    if (!state.theme) state.theme = 'light';
    // normalize any missing cells/slices on loaded data
    state.categories.forEach(cat => cat.journeys.forEach(j => j.stages.forEach(st => st.steps.forEach(step => {
      const c = step.cells || (step.cells = {});

function moveStep(fromStageId, fromIndex, toStageId, toIndex) {
  const j = currentJourney(); if (!j) return;
  const fromStage = j.stages.find(s => s.id === fromStageId);
  const toStage = j.stages.find(s => s.id === toStageId);
  if (!fromStage || !toStage) return;

  const [step] = fromStage.steps.splice(fromIndex, 1);
  let ti = toIndex;
  if (fromStage === toStage && fromIndex < ti) ti--;
  ti = Math.max(0, Math.min(ti, toStage.steps.length));
  toStage.steps.splice(ti, 0, step);
  save(); renderGrid();
}

// ─── Inline edit helper ───────────────────────────────────────────────────────
function startEdit(spanEl, current, onCommit) {
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = current;
  spanEl.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const commit = () => { if (done) return; done = true; onCommit(input.value); };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { done = true; onCommit(current); input.blur(); }
  });
  input.addEventListener('blur', commit);
}

function startElementEdit(textSpan, stepId, slice, elementId, current) {
  const input = document.createElement('input');
  input.className = 'el-edit';
  input.value = current;
  textSpan.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = (val) => {
    if (done) return; done = true;
    if (val.trim() === '') { removeElement(stepId, slice, elementId); }
    else { updateElement(stepId, slice, elementId, val); renderGrid(); }
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(input.value); }
    if (e.key === 'Escape') { finish(current); }
  });
  input.addEventListener('blur', () => finish(input.value));
}

// generic sidebar item builder
function mkSidebarItem({ name, active, sub, draggable, onActivate, onRename, onRemove, onMove, dragKind }) {
  const li = document.createElement('li');
  li.className = 'sb-item' + (active ? ' active' : '');
  li.draggable = !!draggable;

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.setAttribute('aria-hidden', 'true');
  handle.addEventListener('mousedown', e => e.stopPropagation());

  const main = document.createElement('div');
  main.className = 'item-main';
  const nameSpan = document.createElement('span');
  nameSpan.className = 'item-name';
  nameSpan.textContent = name;
  nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(nameSpan, name, onRename); });
  main.appendChild(nameSpan);
  if (sub) {
    const subSpan = document.createElement('span');
    subSpan.className = 'item-sub';

    main.appendChild(subSpan);
  }

  const editBtn = document.createElement('button');
  editBtn.type = 'button';

  editBtn.setAttribute('aria-label', 'Rename');

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'item-remove';
  removeBtn.textContent = '×';
  removeBtn.setAttribute('aria-label', 'Remove');
  removeBtn.title = 'Remove';
  removeBtn.addEventListener('click', e => { e.stopPropagation(); onRemove(); });

  // drag reorder
  li.addEventListener('dragstart', e => {
    sidebarDrag = { kind: dragKind, from: Array.from(li.parentElement.children).indexOf(li) };
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
  });
  li.addEventListener('dragend', () => {
    sidebarDrag = null;
    li.parentElement.querySelectorAll('.sb-item').forEach(el => el.classList.remove('dragging', 'drag-over-above', 'drag-over-below'));
  });
  li.addEventListener('dragover', e => {
    if (!sidebarDrag || sidebarDrag.kind !== dragKind) return;
    e.preventDefault();
    const rect = li.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    li.parentElement.querySelectorAll('.sb-item').forEach(el => el.classList.remove('drag-over-above', 'drag-over-below'));
    li.classList.add(e.clientY < mid ? 'drag-over-above' : 'drag-over-below');
  });
  li.addEventListener('drop', e => {
    if (!sidebarDrag || sidebarDrag.kind !== dragKind) return;
    e.preventDefault(); e.stopPropagation();
    const rect = li.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    let to = Array.from(li.parentElement.children).indexOf(li);
    if (e.clientY >= mid) to++;
    if (sidebarDrag.from < to) to--;
    onMove(sidebarDrag.from, to);
  });

  li.appendChild(handle);
  li.appendChild(main);
  li.appendChild(editBtn);
  li.appendChild(removeBtn);
  li.addEventListener('click', () => onActivate());
  return li;
}

// ─── Grid rendering ───────────────────────────────────────────────────────────
function rowWrap() {
  const r = document.createElement('div');
  r.className = 'grow';
  r.setAttribute('role', 'row');
  return r;
}

function renderGrid() {
  const j = currentJourney();
  gridEl.innerHTML = '';
  if (!j) return;

  const flat = [];
  j.stages.forEach((st, si) => st.steps.forEach((step, ti) => flat.push({ stageIndex: si, stepIndex: ti, stage: st, step })));
  const N = flat.length;
  stepCountEl.textContent = N === 1 ? '1 step' : `${N} steps`;

  gridEl.setAttribute('aria-label', `${j.title} — grid`);

  if (N === 0) { gridEl.style.display = 'none'; return; }
  gridEl.style.display = '';
  gridEl.style.gridTemplateColumns = `${LABEL_COL_W}px repeat(${N}, ${STEP_COL_W}px)`;

  const STAGE_ROW = 1, STEP_ROW = 2, SLICE_BASE = 3;

  // Row 1: corner + stages
  const r1 = rowWrap();
  const corner1 = document.createElement('div');
  corner1.className = 'g-corner';
  corner1.setAttribute('role', 'presentation');
  place(corner1, STAGE_ROW, 1);
  r1.appendChild(corner1);

  j.stages.forEach((st, si) => {
    let firstFlat = -1, lastFlat = -1;
    flat.forEach((f, i) => { if (f.stage === st) { if (firstFlat === -1) firstFlat = i; lastFlat = i; } });
    const startCol = 2 + firstFlat, endCol = 2 + lastFlat;
    const cell = document.createElement('div');
    cell.className = 'g-stage';
    cell.dataset.stageId = st.id;
    cell.setAttribute('role', 'columnheader');
    cell.setAttribute('aria-label', `Stage: ${st.name}`);
    place(cell, STAGE_ROW, startCol, endCol);

    const handle = document.createElement('span'); handle.className = 'drag-handle'; handle.textContent = '⠿'; handle.setAttribute('aria-hidden', 'true');
    const nameSpan = document.createElement('span'); nameSpan.className = 'stage-name'; nameSpan.textContent = st.name;
    nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(nameSpan, st.name, v => renameStage(st.id, v)); });
    const addStepBtn = document.createElement('button'); addStepBtn.className = 'stage-add-step'; addStepBtn.type = 'button';
    addStepBtn.textContent = '+ step'; addStepBtn.setAttribute('aria-label', `Add step to ${st.name}`); addStepBtn.title = 'Add step to stage';
    addStepBtn.addEventListener('click', e => { e.stopPropagation(); addStep(st.id); });

    cell.draggable = true;
    cell.addEventListener('dragstart', e => { gridDrag = { kind: 'stage', from: si }; cell.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
    cell.addEventListener('dragend', () => { gridDrag = null; gridEl.querySelectorAll('.g-stage').forEach(el => el.classList.remove('dragging', 'drop-before', 'drop-after')); });
    cell.addEventListener('dragover', e => {
      if (!gridDrag || gridDrag.kind !== 'stage') return;
      e.preventDefault();
      gridEl.querySelectorAll('.g-stage').forEach(el => el.classList.remove('drop-before', 'drop-after'));
      const rect = cell.getBoundingClientRect(); const mid = rect.left + rect.width / 2;
      cell.classList.add(e.clientX < mid ? 'drop-before' : 'drop-after');
    });
    cell.addEventListener('drop', e => {
      if (!gridDrag || gridDrag.kind !== 'stage') return;
      e.preventDefault();
      const rect = cell.getBoundingClientRect(); const mid = rect.left + rect.width / 2;
      let to = si + (e.clientX >= mid ? 1 : 0);
      if (gridDrag.from < to) to--;
      moveStage(gridDrag.from, to);
    });

    cell.appendChild(handle); cell.appendChild(nameSpan); cell.appendChild(addStepBtn);
    r1.appendChild(cell);
  });
  gridEl.appendChild(r1);

  // Row 2: corner + step headers
  const r2 = rowWrap();
  const corner2 = document.createElement('div');
  corner2.className = 'g-corner row-step'; corner2.textContent = 'Step';
  corner2.setAttribute('role', 'columnheader');
  place(corner2, STEP_ROW, 1);
  r2.appendChild(corner2);

  flat.forEach((f, col) => {
    const colNum = 2 + col;
    const step = f.step;
    const cell = document.createElement('div');
    cell.className = 'g-step';
    cell.dataset.stepId = step.id;
    cell.setAttribute('role', 'columnheader');
    cell.setAttribute('aria-label', `Step: ${step.name}`);
    place(cell, STEP_ROW, colNum);

    const nameSpan = document.createElement('span'); nameSpan.className = 'step-name'; nameSpan.textContent = step.name;
    nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(nameSpan, step.name, v => renameStep(step.id, v)); });
    const removeBtn = document.createElement('button'); removeBtn.type = 'button'; removeBtn.className = 'step-remove';
    removeBtn.textContent = '×'; removeBtn.setAttribute('aria-label', `Remove step ${step.name}`); removeBtn.title = 'Remove step';
    removeBtn.addEventListener('click', e => { e.stopPropagation(); removeStep(step.id); });

    cell.draggable = true;
    cell.addEventListener('dragstart', e => { gridDrag = { kind: 'step', fromStageId: f.stage.id, fromIndex: f.stepIndex }; cell.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
    cell.addEventListener('dragend', () => { gridDrag = null; gridEl.querySelectorAll('.g-step').forEach(el => el.classList.remove('dragging', 'drop-before', 'drop-after')); });
    cell.addEventListener('dragover', e => {
      if (!gridDrag || gridDrag.kind !== 'step') return;
      e.preventDefault();
      gridEl.querySelectorAll('.g-step').forEach(el => el.classList.remove('drop-before', 'drop-after'));
      const rect = cell.getBoundingClientRect(); const mid = rect.left + rect.width / 2;
      cell.classList.add(e.clientX < mid ? 'drop-before' : 'drop-after');
    });
    cell.addEventListener('drop', e => {
      if (!gridDrag || gridDrag.kind !== 'step') return;
      e.preventDefault();
      const rect = cell.getBoundingClientRect(); const mid = rect.left + rect.width / 2;
      let toIndex = f.stepIndex + (e.clientX >= mid ? 1 : 0);
      moveStep(gridDrag.fromStageId, gridDrag.fromIndex, f.stage.id, toIndex);
    });

    cell.appendChild(nameSpan); cell.appendChild(removeBtn);
    r2.appendChild(cell);

    if (_pendingStepRename === step.id) {
      _pendingStepRename = null;
      startEdit(nameSpan, step.name, v => renameStep(step.id, v));
    }
  });
  gridEl.appendChild(r2);

  // Rows 3..: slices
  SLICES.forEach((slice, sIdx) => {
    const row = SLICE_BASE + sIdx;
    const rs = rowWrap();

    const label = document.createElement('div');
    label.className = 'g-slice-label';
    label.textContent = slice.label;
    label.setAttribute('role', 'rowheader');
    place(label, row, 1);
    rs.appendChild(label);

    flat.forEach((f, col) => {
      const colNum = 2 + col;
      const step = f.step;
      const cellEl = document.createElement('div');
      cellEl.className = 'g-cell' + (slice.key === EMOTION_KEY ? ' emotion-cell' : '');
      cellEl.setAttribute('role', 'gridcell');
      cellEl.setAttribute('aria-label', cellAriaLabel(slice, step));
      place(cellEl, row, colNum);

      if (slice.key === EMOTION_KEY) cellEl.appendChild(buildEmotion(step));
      else cellEl.appendChild(buildCellElements(step, slice.key));
      rs.appendChild(cellEl);
    });
    gridEl.appendChild(rs);
  });
}

function cellAriaLabel(slice, step) {
  let detail;
  if (slice.key === EMOTION_KEY) {
    const v = step.cells[EMOTION_KEY];
    detail = (v != null) ? `emotion ${v} of 5` : 'emotion not rated';
  } else {
    const list = step.cells[slice.key] || [];
    detail = list.map(e => e.text).filter(Boolean).join('; ') || 'empty';
  }
  return `${slice.label}, ${step.name}: ${detail}`;
}

let gridDrag = null;

function place(el, row, colStart, colEnd) {
  el.style.gridRow = String(row);
  el.style.gridColumn = colEnd != null ? `${colStart} / ${colEnd + 1}` : String(colStart);
}

function buildCellElements(step, slice) {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '4px'; wrap.style.width = '100%';
  const list = step.cells[slice] || [];
  list.forEach((el, idx) => {
    const row = document.createElement('div');
    row.className = 'element';
    row.draggable = true;

    const handle = document.createElement('span'); handle.className = 'el-handle'; handle.textContent = '⠿'; handle.setAttribute('aria-hidden', 'true');
    const text = document.createElement('span'); text.className = 'el-text'; text.textContent = el.text;
    text.addEventListener('dblclick', ev => { ev.stopPropagation(); startElementEdit(text, step.id, slice, el.id, el.text); });
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'el-remove'; rm.textContent = '×';
    rm.setAttribute('aria-label', 'Remove item'); rm.title = 'Remove item';
    rm.addEventListener('click', ev => { ev.stopPropagation(); removeElement(step.id, slice, el.id); });

    row.addEventListener('dragstart', ev => { elementDrag = { stepId: step.id, slice, from: idx }; row.classList.add('dragging'); ev.stopPropagation(); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', ''); });
    row.addEventListener('dragend', () => { elementDrag = null; row.classList.remove('dragging'); wrap.querySelectorAll('.element').forEach(e => e.classList.remove('dragging')); });
    row.addEventListener('dragover', ev => {
      if (!elementDrag || elementDrag.stepId !== step.id || elementDrag.slice !== slice) return;
      ev.preventDefault(); ev.stopPropagation();
    });
    row.addEventListener('drop', ev => {
      if (!elementDrag || elementDrag.stepId !== step.id || elementDrag.slice !== slice) return;
      ev.preventDefault(); ev.stopPropagation();
      moveElement(elementDrag.stepId, elementDrag.slice, elementDrag.from, idx);
    });

    row.appendChild(handle); row.appendChild(text); row.appendChild(rm);
    wrap.appendChild(row);

    if (_pendingElementEdit && _pendingElementEdit.stepId === step.id && _pendingElementEdit.slice === slice && _pendingElementEdit.elementId === el.id) {
      _pendingElementEdit = null;
      setTimeout(() => startElementEdit(text, step.id, slice, el.id, el.text), 0);
    }
  });

  const addBtn = document.createElement('button');
  addBtn.type = 'button'; addBtn.className = 'add-element'; addBtn.textContent = '+ item';
  addBtn.addEventListener('click', e => { e.stopPropagation(); addElement(step.id, slice); });
  wrap.appendChild(addBtn);
  return wrap;
}
let elementDrag = null;

function buildEmotion(step) {
  const wrap = document.createElement('div');
  wrap.className = 'emo-dots';
  wrap.setAttribute('role', 'radiogroup');
  wrap.setAttribute('aria-label', 'Emotion rating');
  const val = step.cells[EMOTION_KEY];
  for (let v = 1; v <= 5; v++) {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'emo-dot' + (val != null && v <= val ? ' on' : '');
    dot.setAttribute('role', 'radio');
    dot.setAttribute('aria-checked', val === v ? 'true' : 'false');
    if (val != null && v <= val) dot.style.setProperty('--emo', EMO_COLORS[val - 1]);
    dot.setAttribute('aria-label', `${v} of 5`);
    dot.title = `${v}/5`;
    dot.addEventListener('click', e => { e.stopPropagation(); setEmotion(step.id, v); });
    wrap.appendChild(dot);
  }
  if (val != null) {
    const clr = document.createElement('button'); clr.type = 'button'; clr.className = 'emo-clear'; clr.textContent = '×';
    clr.setAttribute('aria-label', 'Clear emotion'); clr.title = 'Clear';
    clr.addEventListener('click', e => { e.stopPropagation(); setEmotion(step.id, val); });
    wrap.appendChild(clr);
  }
  return wrap;
}

// ─── Export PNG (theme-aware via CSS tokens) ──────────────────────────────────
function safeFilename(name) { return (name || 'unnamed').trim().replace(/[/\\:*?"<>|]/g, '_'); }
function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}

function exportPng() {
  const j = currentJourney(); if (!j) return;
  const flat = [];
  j.stages.forEach(st => st.steps.forEach(step => flat.push({ stage: st, step })));
  if (flat.length === 0) return;

  const C = {
    bg: cssVar('--bg', '#fff'), panel: cssVar('--panel', '#fff'), panel2: cssVar('--panel-2', '#f1f3f5'),
    border: cssVar('--border', '#d0d7de'), borderSoft: cssVar('--border-soft', '#e5e7eb'),
    text: cssVar('--text', '#1f2328'), text2: cssVar('--text-2', '#57606a'), text3: cssVar('--text-3', '#6e7781'),
    cell: cssVar('--cell', '#fff'),
  };
  const pad = 14, headerH = 30, stepHeaderH = 32, labelW = 140, colW = 200, lineH = 15, font = '12px -apple-system,Segoe UI,sans-serif';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = font;

  function wrapLines(text, maxW) {
    if (!text) return [];
    const words = String(text).split(/\s+/);
    const lines = []; let cur = '';
    words.forEach(w => {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  const sliceRows = SLICES.map(slice => {
    let maxLines = 1;
    flat.forEach(f => {
      if (slice.key === EMOTION_KEY) { maxLines = Math.max(maxLines, 1); return; }
      const list = f.step.cells[slice.key] || [];
      let n = 0;
      list.forEach(el => { n += Math.max(1, wrapLines(el.text, colW - 18).length); });
      if (list.length === 0) n = 1;
      maxLines = Math.max(maxLines, n);
    });
    return { slice, h: Math.max(34, maxLines * lineH + 14) };
  });

  const totalW = pad * 2 + labelW + colW * flat.length;
  const totalH = pad * 2 + headerH + stepHeaderH + sliceRows.reduce((a, r) => a + r.h, 0);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = totalW * dpr; canvas.height = totalH * dpr;
  canvas.style.width = totalW + 'px'; canvas.style.height = totalH + 'px';
  ctx.scale(dpr, dpr);
  ctx.font = font;

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, totalW, totalH);

  const x0 = pad, y0 = pad;
  ctx.fillStyle = C.text; ctx.font = 'bold 14px -apple-system,Segoe UI,sans-serif';
  ctx.fillText(`${j.title}  ·  ${personaName(j.personaId)}`, x0, y0 + 16);
  ctx.font = font;

  let y = y0 + headerH;
  j.stages.forEach(st => {
    const first = flat.findIndex(f => f.stage === st);
    const lasts = []; for (let i = 0; i < flat.length; i++) if (flat[i].stage === st) lasts.push(i);
    const last = lasts[lasts.length - 1];
    const x1 = x0 + labelW + first * colW;
    ctx.fillStyle = C.panel2; ctx.fillRect(x1, y, (last - first + 1) * colW, 22);
    ctx.fillStyle = C.text2; ctx.font = 'bold 12px -apple-system,Segoe UI,sans-serif';
    ctx.fillText(st.name, x1 + 8, y + 15);
    ctx.font = font;
  });
  y += 22;

  flat.forEach((f, col) => {
    const x1 = x0 + labelW + col * colW;
    ctx.fillStyle = C.panel; ctx.fillRect(x1, y, colW, stepHeaderH);
    ctx.strokeStyle = C.border; ctx.strokeRect(x1, y, colW, stepHeaderH);
    ctx.fillStyle = C.text2;
    ctx.fillText(trunc(ctx, f.step.name, colW - 12), x1 + 7, y + 20);
  });
  ctx.fillStyle = C.panel2; ctx.fillRect(x0, y, labelW, stepHeaderH);
  ctx.strokeStyle = C.border; ctx.strokeRect(x0, y, labelW, stepHeaderH);
  ctx.fillStyle = C.text3; ctx.fillText('Step', x0 + 8, y + 20);
  y += stepHeaderH;

  sliceRows.forEach(({ slice, h }) => {
    ctx.fillStyle = C.panel2; ctx.fillRect(x0, y, labelW, h);
    ctx.strokeStyle = C.border; ctx.strokeRect(x0, y, labelW, h);
    ctx.fillStyle = C.text3; ctx.font = 'bold 11px -apple-system,Segoe UI,sans-serif';
    ctx.fillText(slice.label, x0 + 8, y + 17);
    ctx.font = font;
    flat.forEach((f, col) => {
      const x1 = x0 + labelW + col * colW;
      ctx.fillStyle = C.cell; ctx.fillRect(x1, y, colW, h);
      ctx.strokeStyle = C.borderSoft; ctx.strokeRect(x1, y, colW, h);
      if (slice.key === EMOTION_KEY) {
        const v = f.step.cells[EMOTION_KEY];
        if (v != null) {
          ctx.fillStyle = EMO_COLORS[v - 1];
          for (let k = 0; k < v; k++) { ctx.beginPath(); ctx.arc(x1 + 12 + k * 16, y + h / 2, 5, 0, Math.PI * 2); ctx.fill(); }
        } else { ctx.fillStyle = C.text3; ctx.fillText('—', x1 + 8, y + h / 2 + 4); }
      } else {
        const list = f.step.cells[slice.key] || [];
        let ty = y + 16;
        list.forEach(el => {
          const lines = wrapLines(el.text, colW - 18) || [''];
          ctx.fillStyle = C.text2;
          lines.forEach(ln => { ctx.fillText(ln, x1 + 8, ty); ty += lineH; });
          ty += 2;
        });
        if (list.length === 0) { ctx.fillStyle = C.text3; ctx.fillText('—', x1 + 8, y + 17); }
      }
    });
    y += h;
  });

  canvas.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${safeFilename(j.title)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    btnExport.textContent = '✓ Saved';
    setTimeout(() => { btnExport.textContent = '↓ Export PNG'; }, 1500);
  }, 'image/png');
}

function trunc(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

// ─── Export / Import JSON ─────────────────────────────────────────────────────
function dateStamp() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
}
function downloadJson(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportDatabase() {
  const data = { version: 1, kind: 'database', app: 'customer-journey',
    categories: JSON.parse(JSON.stringify(state.categories)),
    personas: JSON.parse(JSON.stringify(state.personas)) };
  downloadJson(data, 'customer-journey-backup-' + dateStamp() + '.json');
  flashToast('✓ Database exported');
}
function exportJourney() {
  const j = currentJourney(); if (!j) return;
  const persona = j.personaId != null ? { name: personaName(j.personaId) } : null;
  const data = { version: 1, kind: 'journey', app: 'customer-journey',
    journey: JSON.parse(JSON.stringify(j)), persona };
  downloadJson(data, safeFilename(j.title) + '.json');
  flashToast('✓ Journey exported');
}

function normalizeStep(step, idx) {
  if (!step.name) step.name = `Step ${(idx ?? 0) + 1}`;
  const c = step.cells || (step.cells = {});
  SLICES.forEach(s => { if (!(s.key in c)) c[s.key] = (s.key === EMOTION_KEY) ? null : []; });
}
function normalizeJourney(j) {
  if (!j || typeof j !== 'object') j = {};
  if (!j.title) j.title = 'Imported journey';
  if (j.description == null) j.description = '';
  if (j.expectations == null) j.expectations = '';
  if (!Array.isArray(j.stages)) j.stages = [];
  j.stages.forEach((st, si) => {
    if (!st.name) st.name = `Stage ${si + 1}`;
    if (!Array.isArray(st.steps)) st.steps = [];
    st.steps.forEach((step, ti) => normalizeStep(step, ti));
  });
}
function regenElementIds(list) { if (Array.isArray(list)) list.forEach(e => { e.id = uid(); }); }
function regenStep(step) { step.id = uid(); SLICES.forEach(s => { if (s.key !== EMOTION_KEY) regenElementIds(step.cells?.[s.key]); }); }
function regenStage(st) { st.id = uid(); (st.steps || []).forEach(regenStep); }
function regenJourney(j) { j.id = uid(); (j.stages || []).forEach(regenStage); }

function importDatabase(data) {
  const personas = Array.isArray(data.personas) ? data.personas : [];
  const personaMap = {};
  personas.forEach(p => { const old = p.id; p.id = uid(); personaMap[old] = p.id; });
  const categories = Array.isArray(data.categories) ? data.categories : [];
  categories.forEach(cat => {
    cat.id = uid();
    (cat.journeys || []).forEach(j => {
      normalizeJourney(j); regenJourney(j);
      j.personaId = (j.personaId != null && personaMap[j.personaId] != null) ? personaMap[j.personaId] : null;
    });
  });
  state.categories = categories;
  state.personas = personas;
  state.activeCategory = 0; state.activeJourney = 0;
  ensureActiveIndicesValid();
  save(); render();
}
function importJourney(data) {
  let cat = currentCategory();
  if (!cat) { cat = newCategory('Cash loan'); state.categories.push(cat); state.activeCategory = state.categories.length - 1; state.activeJourney = 0; }
  let personaId = null;
  if (data.persona && data.persona.name) {
    let p = state.personas.find(x => x.name === data.persona.name);
    if (!p) { p = newPersona(data.persona.name); state.personas.push(p); }
    personaId = p.id;
  } else if (state.personas[0]) personaId = state.personas[0].id;
  const j = data.journey || data;
  normalizeJourney(j); regenJourney(j);
  j.personaId = personaId;
  cat.journeys.push(j);
  state.activeJourney = cat.journeys.length - 1;
  save(); render();
}
function importFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); } catch (err) { flashToast('✗ Invalid file'); return; }
    try {
      if (data && (data.kind === 'database' || Array.isArray(data.categories))) {
        if (!confirm('Replace ALL data with this imported file? This cannot be undone.')) { flashToast('Import cancelled'); return; }
        importDatabase(data);
        const nj = state.categories.reduce((a, c) => a + (c.journeys?.length || 0), 0);
        flashToast(`✓ Imported (${nj} journeys)`);
      } else if (data && (data.kind === 'journey' || data.journey || Array.isArray(data.stages))) {
        importJourney(data);
        flashToast('✓ Journey imported');
      } else {
        flashToast('✗ Invalid file');
      }
    } catch (err) { console.error(err); flashToast('✗ Invalid file'); }
  };
  reader.onerror = () => flashToast('✗ Invalid file');
  reader.readAsText(file);
}

let _toastTimer = null;
function flashToast(msg) {
  let el = document.getElementById('app-toast');
  if (!el) {
    el = document.createElement('div'); el.id = 'app-toast';
    el.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:12px;z-index:9999;box-shadow:var(--shadow);max-width:90vw;text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
  el.style.display = '';
}

// ─── Wiring ───────────────────────────────────────────────────────────────────
document.getElementById('btn-theme').addEventListener('click', toggleTheme);
document.getElementById('btn-add-category').addEventListener('click', () => createCategory());
document.getElementById('btn-add-persona').addEventListener('click', () => createPersona());
document.getElementById('btn-add-journey').addEventListener('click', () => createJourney());
btnEmptyAdd.addEventListener('click', () => {
  if (!currentCategory()) createCategory('Cash loan');
  createJourney();
});
btnExport.addEventListener('click', exportPng);
const btnExportJson = document.getElementById('btn-export-json');
const btnImport = document.getElementById('btn-import');
const importInput = document.getElementById('import-file');
btnExportJson.addEventListener('click', exportDatabase);
btnImport.addEventListener('click', () => importInput.click());
importInput.addEventListener('change', () => { importFromFile(importInput.files[0]); importInput.value = ''; });

// sidebar resize
const SB_MIN = 160, SB_MAX = 420;
sidebarResizer.addEventListener('mousedown', e => {
  e.preventDefault();
  const startX = e.clientX, startW = sidebar.offsetWidth;
  sidebarResizer.classList.add('resizing');
  function onMove(ev) {
    const w = Math.min(SB_MAX, Math.max(SB_MIN, startW + ev.clientX - startX));
    sidebar.style.width = w + 'px';
  }
  function onUp() {
    sidebarResizer.classList.remove('resizing');
    state.sidebarWidth = sidebar.offsetWidth;
    save();
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  await load();
  if (state.categories.length === 0) {
    const cat = newCategory('Cash loan');
    const persona = newPersona('Anna');
    state.personas.push(persona);
    const j = newJourney('Cash loan application', persona.id);
    j.description = 'Submitting a loan application';
    cat.journeys.push(j);
    state.categories.push(cat);
    save();
  }
  ensureActiveIndicesValid();
  applyTheme();
  sidebar.style.width = (state.sidebarWidth || 220) + 'px';
  render();
})();
</script>
