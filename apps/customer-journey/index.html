<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Journey</title>
<style>
  /* ── Theme tokens ── */
  :root {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --panel-3: #eaecef;
    --inset: #ffffff;
    --border: #d0d7de;
    --border-soft: #e5e7eb;
    --text: #1f2328;
    --text-2: #4b5563;
    --text-3: #5c6670;
    --text-4: #626a73;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-contrast: #ffffff;
    --accent-soft: rgba(37,99,235,0.12);
    --accent-soft-text: #2563eb;
    --danger: #d1242f;
    --danger-soft: rgba(209,36,47,0.10);
    --chip: #eaecef;
    --chip-text: #57606a;
    --cell: #ffffff;
    --cell-hover: #f6f8fa;
    --element-bg: #f6f8fa;
    --element-border: #e1e4e8;
    --element-hover-bg: #eef0f2;
    --scrollbar: #c8d0d8;
    --shadow: 0 1px 2px rgba(31,35,40,0.06);
    --overlay: rgba(0,0,0,0.5);
  }
  [data-theme="dark"] {
    --bg: #111;
    --panel: #141414;
    --panel-2: #161616;
    --panel-3: #1a1a1a;
    --inset: #1a1a1a;
    --border: #2a2a2a;
    --border-soft: #1e1e1e;
    --text: #e0e0e0;
    --text-2: #b9bfc6;
    --text-3: #9aa0a6;
    --text-4: #8a9098;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-contrast: #fff;
    --accent-soft: rgba(59,130,246,0.10);
    --accent-soft-text: #60a5fa;
    --danger: #f43f5e;
    --danger-soft: rgba(244,63,94,0.10);
    --chip: #2a2a2a;
    --chip-text: #a8aeb6;
    --cell: #111;
    --cell-hover: #161616;
    --element-bg: #1a1a1a;
    --element-border: #262626;
    --element-hover-bg: #1e1e1e;
    --scrollbar: #2a2a2a;
    --shadow: none;
    --overlay: rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: transparent; border: none; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--panel-3);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
  header .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--text-3); }

  .btn { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.15s, border-color 0.15s; }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { color: var(--text-2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--panel-2); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Main layout ── */
  main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-4); flex-shrink: 0;
  }
  .sidebar-section-header .btn-add { cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; border-radius: 3px; color: var(--text-4); }
  .sidebar-section-header .btn-add:hover { color: var(--text-2); background: var(--panel-2); }

  .sb-list { list-style: none; overflow-y: auto; flex-shrink: 0; }
  #category-list { border-bottom: 1px solid var(--border-soft); max-height: 32%; }
  #persona-list   { border-bottom: 1px solid var(--border-soft); max-height: 22%; }
  #theme-list     { border-bottom: 1px solid var(--border-soft); max-height: 18%; }
  #journey-list   { flex: 1; overflow-y: auto; }

  .sb-item { display: flex; align-items: flex-start; padding: 5px 10px; font-size: 12px; color: var(--text-3); cursor: pointer; gap: 10px; }
  .sb-item:hover { background: var(--cell-hover); color: var(--text-2); }
  .sb-item.active { background: var(--accent-soft); color: var(--text); }
  .sb-item .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .sb-item .item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-item .item-sub { font-size: 10.5px; color: var(--text-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 0; }
  .sb-item .item-count { background: var(--chip); border-radius: 10px; padding: 0 6px; font-size: 10px; color: var(--chip-text); margin-left: 4px; flex-shrink: 0; }
  .sb-item input.rename-input { width: 100%; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; }

  .sb-item .item-edit, .sb-item .item-remove {
    opacity: 0; cursor: pointer; flex-shrink: 0; line-height: 1; padding: 2px 3px; border-radius: 3px; font-size: 11px; user-select: none;
  }
  .sb-item .drag-handle { opacity: 0; color: var(--text-4); flex-shrink: 0; line-height: 1; padding: 2px 3px; border-radius: 3px; font-size: 11px; user-select: none; cursor: grab; }
  .sb-item:hover .item-edit, .sb-item:hover .item-remove, .sb-item:hover .drag-handle { opacity: 1; }
  .sb-item .item-edit:hover { color: var(--accent-soft-text); background: var(--accent-soft); }
  .sb-item .item-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .sb-item.dragging { opacity: 0.35; }
  .sb-item.drag-over-above { border-top: 2px solid var(--accent); }
  .sb-item.drag-over-below { border-bottom: 2px solid var(--accent); }

  /* Journey list as cards */
  .sb-item.sb-card { background: var(--cell); border: 1px solid var(--border-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  .sb-item.sb-card:hover { background: var(--cell-hover); border-color: var(--border); }
  .sb-item.sb-card.active { background: var(--accent-soft); border-color: var(--accent); }
  .sb-item.sb-card .item-name { font-weight: 600; color: var(--text-2); }
  .sb-item.sb-card.active .item-name { color: var(--text); }

  /* Sidebar resize handle */
  #sidebar-resizer { width: 4px; flex-shrink: 0; background: var(--border); cursor: ew-resize; transition: background 0.15s; }
  #sidebar-resizer:hover, #sidebar-resizer.resizing { background: var(--accent); }

  /* Scrollbars */
  .sb-list::-webkit-scrollbar, #grid-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .sb-list::-webkit-scrollbar-track, #grid-scroll::-webkit-scrollbar-track { background: transparent; }
  .sb-list::-webkit-scrollbar-thumb, #grid-scroll::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  /* ── Main panel ── */
  .panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header {
    padding: 8px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-4); background: var(--panel-2); border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-header .count { background: var(--chip); border-radius: 10px; padding: 1px 7px; font-size: 11px; color: var(--chip-text); text-transform: none; }

  /* Journey metadata bar */
  #journey-meta { padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  #journey-meta .meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #journey-meta .title-input { background: var(--inset); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 14px; font-weight: 600; padding: 5px 9px; outline: none; flex: 1; min-width: 180px; }
  #journey-meta .title-input:focus { border-color: var(--accent); }
  #journey-meta select, #journey-meta .field-input {
    background: var(--inset); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 12px; padding: 4px 8px; outline: none;
  }
  #journey-meta select:focus, #journey-meta .field-input:focus { border-color: var(--accent); }
  #journey-meta .field-input { flex: 1; min-width: 160px; }
  #journey-meta .field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-4); }

  /* ── Grid ── */
  #grid-scroll { flex: 1; overflow: auto; padding: 0; background: var(--bg); }
  #grid { display: grid; align-content: start; }
  .grow { display: contents; }

  .g-corner { background: var(--panel-2); position: sticky; left: 0; z-index: 4; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .g-corner.row-step { display: flex; align-items: center; padding: 0 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-4); }

  /* Stage header cell (spans its steps) */
  .g-stage {
    background: var(--panel-3); border: 1px solid var(--border); border-bottom: none;
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 30px;
  }
  .g-stage .drag-handle { color: var(--text-4); cursor: grab; font-size: 12px; user-select: none; }
  .g-stage:hover .drag-handle { color: var(--text-3); }
  .g-stage .stage-name { font-size: 12px; font-weight: 600; color: var(--cj-stage-text, var(--text-2)); flex: 1; cursor: text; padding: 1px 3px; border-radius: 3px; }
  .g-stage .stage-name:hover { background: var(--panel-2); }
  .g-stage input.rename-input { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; }
  .g-stage .stage-add-step { cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; border-radius: 3px; color: var(--text-4); }
  .g-stage .stage-add-step:hover { color: var(--accent-soft-text); background: var(--accent-soft); }
  .g-stage .stage-remove { opacity: 0; cursor: pointer; font-size: 12px; padding: 0 3px; border-radius: 3px; color: var(--text-4); }
  .g-stage:hover .stage-remove { opacity: 1; }
  .g-stage .stage-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .g-stage.dragging { opacity: 0.4; }
  .g-stage.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
  .g-stage.drop-after  { box-shadow: inset -3px 0 0 var(--accent); }

  /* Step header cell */
  .g-step {
    background: var(--panel); border: 1px solid var(--border); border-bottom: none;
    display: flex; align-items: center; gap: 4px; padding: 4px 6px; min-height: 34px; cursor: grab;
  }
  .g-step .step-name { font-size: 12px; color: var(--text-2); flex: 1; cursor: text; padding: 1px 3px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-step .step-name:hover { background: var(--panel-2); color: var(--text); }
  .g-step input.rename-input { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; min-width: 0; }
  .g-step .step-remove { opacity: 0; cursor: pointer; font-size: 12px; padding: 0 3px; border-radius: 3px; color: var(--text-4); }
  .g-step:hover .step-remove { opacity: 1; }
  .g-step .step-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .g-step.dragging { opacity: 0.35; }
  .g-step.drop-before { box-shadow: inset 3px 0 0 var(--accent); }
  .g-step.drop-after  { box-shadow: inset -3px 0 0 var(--accent); }

  /* Slice label cell (sticky left) */
  .g-slice-label {
    background: var(--panel-2); position: sticky; left: 0; z-index: 3;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; padding: 0 12px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3);
  }

  /* Data cell */
  .g-cell {
    background: var(--cell); border-right: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft);
    padding: 6px 7px; min-height: 56px; display: flex; flex-direction: column; gap: 4px; position: relative;
  }
  .g-cell:hover { background: var(--cell-hover); }
  .g-cell .element {
    display: flex; align-items: flex-start; gap: 4px;
    background: var(--element-bg); border: 1px solid var(--element-border); border-radius: 4px; padding: 3px 5px;
  }
  .g-cell .element:hover { border-color: var(--border); background: var(--element-hover-bg); }
  .g-cell .element .el-text { flex: 1; font-size: 11.5px; color: var(--text-2); line-height: 1.35; cursor: text; word-break: break-word; white-space: pre-wrap; }
  .g-cell .element .el-text:empty::before { content: '…'; color: var(--text-4); }
  .g-cell .element input.el-edit { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 11.5px; padding: 1px 4px; outline: none; }
  .g-cell .element .el-handle { color: var(--text-4); cursor: grab; font-size: 10px; line-height: 1.4; user-select: none; opacity: 0; }
  .g-cell .element:hover .el-handle { opacity: 1; }
  .g-cell .element .el-remove { color: var(--text-4); cursor: pointer; font-size: 11px; line-height: 1.4; opacity: 0; }
  .g-cell .element:hover .el-remove { opacity: 1; }
  .g-cell .element .el-remove:hover { color: var(--danger); }
  .g-cell .element.dragging { opacity: 0.35; }
  .g-cell .add-element { align-self: flex-start; border: 1px dashed var(--border); border-radius: 4px; cursor: pointer; font-size: 11px; padding: 2px 7px; color: var(--text-4); }
  .g-cell .add-element:hover { border-color: var(--accent); color: var(--accent-soft-text); }

  /* Emotion cell */
  .g-cell.emotion-cell { justify-content: center; }
  .emo-dots { display: flex; gap: 5px; align-items: center; justify-content: center; }
  .emo-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--chip); cursor: pointer; border: 1px solid var(--border); padding: 0; }
  .emo-dot.on { background: var(--emo, var(--accent)); border-color: var(--emo, var(--accent)); }
  .emo-clear { font-size: 10px; color: var(--text-4); cursor: pointer; margin-left: 6px; }
  .emo-clear:hover { color: var(--danger); }

  /* Empty states */
  .empty-state { border: 2px dashed var(--border); border-radius: 12px; padding: 50px 40px; text-align: center; margin: 24px; }
  .empty-state p { font-size: 14px; color: var(--text-3); margin-bottom: 6px; }
  .empty-state small { font-size: 12px; color: var(--text-4); }
  .empty-state .btn { margin-top: 14px; }

  .sb-empty { padding: 10px 12px; font-size: 11px; color: var(--text-4); }

  /* storage error toast */
  #storage-error { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 10px 16px; font-size: 12px; z-index: 9999; max-width: 90vw; text-align: center; }

  /* ── Screenshots row (stacked, full cell width, no cropping) ── */
  .g-cell .shots { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: stretch; }
  .shot-thumb {
    position: relative; width: 100%; height: auto; max-height: 440px; padding: 0;
    border: 1px solid var(--element-border); border-radius: 4px; overflow: hidden;
    background: var(--element-bg); cursor: zoom-in;
  }
  .shot-thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .shot-thumb:hover { border-color: var(--accent); }
  .shot-thumb .shot-remove {
    position: absolute; top: 1px; right: 1px; width: 16px; height: 16px; line-height: 1;
    font-size: 11px; border-radius: 3px; color: var(--text-4); background: var(--panel);
    opacity: 0; cursor: pointer; padding: 0;
  }
  .shot-thumb:hover .shot-remove, .shot-thumb .shot-remove:focus-visible { opacity: 1; }
  .shot-thumb .shot-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .shot-add {
    width: 100%; height: 48px; border: 1px dashed var(--border); border-radius: 4px; cursor: pointer;
    font-size: 14px; color: var(--text-4); background: transparent; padding: 0;
  }
  .shot-add:hover { border-color: var(--accent); color: var(--accent-soft-text); }
  .g-cell.shots-cell.drag-over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .g-cell.shots-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ── Overlays: lightbox + persona card ── */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 10000; }
  #lightbox { cursor: zoom-out; }
  #lightbox img { max-width: 90vw; max-height: 85vh; object-fit: contain; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
  #lightbox .lb-close { position: absolute; top: 14px; right: 16px; width: 32px; height: 32px; border-radius: 6px; font-size: 18px; color: var(--text); background: var(--panel); border: 1px solid var(--border); cursor: pointer; }
  #lightbox .lb-close:hover { color: var(--danger); border-color: var(--danger); }
  #lightbox .lb-caption { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--text-2); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lightbox .lb-missing { color: var(--text-2); font-size: 13px; background: var(--panel); border: 1px dashed var(--border); border-radius: 8px; padding: 16px 22px; }

  .persona-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); width: min(480px, 92vw); max-height: 85vh; overflow-y: auto; padding: 18px 20px; position: relative; }
  .persona-card::-webkit-scrollbar { width: 6px; }
  .persona-card::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .persona-card h2 { font-size: 16px; font-weight: 600; color: var(--text); margin-right: 28px; }
  .persona-card .pc-role { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .persona-card .pc-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.5; margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .persona-card .pc-quote { font-size: 12.5px; font-style: italic; color: var(--text-2); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin-top: 12px; }
  .persona-card .pc-close { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 5px; font-size: 15px; color: var(--text-3); cursor: pointer; }
  .persona-card .pc-close:hover { color: var(--danger); background: var(--danger-soft); }
  .persona-card .pc-section { margin-top: 14px; }
  .persona-card .pc-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-4); margin-bottom: 5px; }
  .persona-card .pc-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .persona-card .pc-list li { font-size: 12px; color: var(--text-2); padding-left: 13px; position: relative; line-height: 1.4; }
  .persona-card .pc-list li::before { content: '•'; position: absolute; left: 2px; color: var(--text-4); }
  .persona-card .pc-list.pc-goals li::before { color: var(--accent-soft-text); }
  .persona-card .pc-list.pc-frustrations li::before { color: var(--danger); }
  .persona-card .pc-empty { font-size: 12px; color: var(--text-4); font-style: italic; margin-top: 12px; }

  /* ── Touchpoints: slice-label manage + in-cell picker + manager modal ── */
  .g-slice-label .slice-manage { margin-left: auto; opacity: 0; cursor: pointer; font-size: 12px; padding: 1px 4px; border-radius: 3px; color: var(--text-4); flex-shrink: 0; }
  .g-slice-label:hover .slice-manage, .g-slice-label .slice-manage:focus-visible { opacity: 1; }
  .g-slice-label .slice-manage:hover { color: var(--text-2); background: var(--panel-3); }

  .tp-picker { position: fixed; z-index: 9000; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); min-width: 190px; max-width: 280px; max-height: 280px; overflow-y: auto; padding: 4px; }
  .tp-picker::-webkit-scrollbar { width: 6px; }
  .tp-picker::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .tp-picker .tp-filter { width: 100%; background: var(--inset); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; padding: 4px 7px; outline: none; margin-bottom: 4px; }
  .tp-picker .tp-filter:focus { border-color: var(--accent); }
  .tp-picker .tp-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 5px 8px; border-radius: 5px; font-size: 12px; color: var(--text-2); cursor: pointer; }
  .tp-picker .tp-item:hover { background: var(--cell-hover); color: var(--text); }
  .tp-picker .tp-item .tp-check { width: 13px; flex-shrink: 0; color: var(--accent-soft-text); font-size: 11px; visibility: hidden; }
  .tp-picker .tp-item.present .tp-check { visibility: visible; }
  .tp-picker .tp-item .tp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-picker .tp-item.present .tp-name { color: var(--text-3); }
  .tp-picker .tp-sep { border-top: 1px solid var(--border-soft); margin: 4px 2px; }
  .tp-picker .tp-extra { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 5px 8px; border-radius: 5px; font-size: 12px; color: var(--text-3); cursor: pointer; }
  .tp-picker .tp-extra:hover { background: var(--cell-hover); color: var(--accent-soft-text); }
  .tp-picker .tp-input { width: 100%; background: var(--inset); border: 1px solid var(--accent); border-radius: 4px; color: var(--text); font-size: 12px; padding: 4px 7px; outline: none; margin: 2px 0; }
  .tp-picker .tp-none { padding: 8px 8px 6px; font-size: 11.5px; color: var(--text-4); }

  .tp-manager { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); width: min(460px, 92vw); max-height: 85vh; display: flex; flex-direction: column; padding: 18px 20px; position: relative; }
  .tp-manager h2 { font-size: 15px; font-weight: 600; color: var(--text); margin-right: 28px; }
  .tp-manager .tm-sub { font-size: 11px; color: var(--text-4); margin-top: 2px; }
  .tp-manager .tm-close { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 5px; font-size: 15px; color: var(--text-3); cursor: pointer; }
  .tp-manager .tm-close:hover { color: var(--danger); background: var(--danger-soft); }
  .tp-manager .tm-toolbar { display: flex; gap: 6px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .tp-manager .tm-add-input { flex: 1; min-width: 80px; background: var(--inset); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 12px; padding: 5px 8px; outline: none; }
  .tp-manager .tm-add-input:focus { border-color: var(--accent); }
  .tp-manager .tm-list { list-style: none; overflow-y: auto; margin-top: 10px; min-height: 40px; }
  .tp-manager .tm-list::-webkit-scrollbar { width: 6px; }
  .tp-manager .tm-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .tp-manager .tm-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); }
  .tp-manager .tm-row:hover { background: var(--cell-hover); }
  .tp-manager .tm-row .tm-handle { color: var(--text-4); cursor: grab; font-size: 11px; opacity: 0; flex-shrink: 0; line-height: 1; padding: 2px 1px; user-select: none; }
  .tp-manager .tm-row:hover .tm-handle { opacity: 1; }
  .tp-manager .tm-row .tm-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; padding: 1px 3px; border-radius: 3px; }
  .tp-manager .tm-row .tm-name:hover { background: var(--panel-2); color: var(--text); }
  .tp-manager .tm-row input.rename-input { flex: 1; background: var(--inset); border: 1px solid var(--accent); border-radius: 3px; color: var(--text); font-size: 12px; padding: 1px 4px; outline: none; min-width: 0; }
  .tp-manager .tm-row .tm-count { background: var(--chip); border-radius: 10px; padding: 0 6px; font-size: 10px; color: var(--chip-text); flex-shrink: 0; }
  .tp-manager .tm-row .tm-edit, .tp-manager .tm-row .tm-remove { opacity: 0; cursor: pointer; color: var(--text-4); font-size: 11px; padding: 2px 3px; border-radius: 3px; flex-shrink: 0; line-height: 1; }
  .tp-manager .tm-row:hover .tm-edit, .tp-manager .tm-row:hover .tm-remove { opacity: 1; }
  .tp-manager .tm-row .tm-edit:hover { color: var(--accent-soft-text); background: var(--accent-soft); }
  .tp-manager .tm-row .tm-remove:hover { color: var(--danger); background: var(--danger-soft); }
  .tp-manager .tm-row.dragging { opacity: 0.35; }
  .tp-manager .tm-row.drag-over-above { border-top: 2px solid var(--accent); }
  .tp-manager .tm-row.drag-over-below { border-bottom: 2px solid var(--accent); }
  .tp-manager .tm-empty { padding: 24px 10px; font-size: 12px; color: var(--text-4); text-align: center; border: 2px dashed var(--border); border-radius: 8px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>Customer Journey</h1>
  <span class="hint">Customer journey map · stages / steps × slices</span>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-sm" id="btn-theme" aria-label="Switch theme" title="Switch theme">☀</button>
  <button class="btn btn-ghost btn-sm" id="btn-import" aria-label="Import JSON" title="Import JSON (full DB or single journey)">↥ Import</button>
  <button class="btn btn-ghost btn-sm" id="btn-export-json" aria-label="Export whole database as JSON" title="Export whole database as JSON">↧ Export JSON</button>
  <button class="btn btn-primary btn-sm" id="btn-export">↓ Export PNG</button>
  <input type="file" id="import-file" accept="application/json,.json" style="display:none">
  <input type="file" id="shot-file" accept="image/*" multiple style="display:none">
</header>

<main>
  <!-- SIDEBAR -->
  <aside id="sidebar" aria-label="Library">
    <div class="sidebar-section-header">
      Categories
      <button class="btn-add" id="btn-add-category" aria-label="New category" title="New category">+</button>
    </div>
    <ul id="category-list" class="sb-list"></ul>

    <div class="sidebar-section-header">
      Personas
      <span style="display:flex; gap:2px; align-items:center;">
        <button class="btn-add" id="btn-import-personas" aria-label="Import personas from JSON" title="Import personas from JSON">↥</button>
        <button class="btn-add" id="btn-add-persona" aria-label="New persona" title="New persona">+</button>
      </span>
    </div>
    <ul id="persona-list" class="sb-list"></ul>

    <div class="sidebar-section-header">
      Themes
      <span style="display:flex; gap:2px; align-items:center;">
        <button class="btn-add" id="btn-import-themes" aria-label="Import themes from JSON" title="Import themes from JSON">↥</button>
        <button class="btn-add" id="btn-export-themes" aria-label="Export themes as JSON" title="Export themes as JSON (for the business repo)">↧</button>
      </span>
    </div>
    <ul id="theme-list" class="sb-list"></ul>

    <div class="sidebar-section-header">
      Customer journeys
      <button class="btn-add" id="btn-add-journey" aria-label="New journey" title="New journey">+</button>
    </div>
    <ul id="journey-list" class="sb-list"></ul>
  </aside>

  <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize library"></div>

  <!-- MAIN PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span id="panel-title">Customer journey</span>
      <span class="count" id="step-count">0 steps</span>
    </div>
    <div id="journey-meta" style="display:none"></div>
    <div id="grid-scroll">
      <div id="grid-empty" class="empty-state" style="display:none">
        <p>No customer journey</p>
        <small>Add a category and your first journey to start mapping.</small>
        <div><button class="btn btn-primary btn-sm" id="btn-empty-add">Add customer journey</button></div>
      </div>
      <div id="grid" role="grid" aria-label="Customer journey grid"></div>
    </div>
  </div>
</main>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'ux-customer-journey_v1';
const LABEL_COL_W = 150;
const STEP_COL_W  = 300;

const SLICES = [
  { key: 'action',      label: 'Actions' },
  { key: 'touchpoint',  label: 'Touchpoints' },
  { key: 'mindset',     label: 'Mindset' },
  { key: 'emotion',     label: 'Emotions' },
  { key: 'pain-point',  label: 'Pain points' },
  { key: 'idea',        label: 'Ideas' },
  { key: 'insight',     label: 'Insights' },
  { key: 'screenshots', label: 'Screenshots' },
];
const EMOTION_KEY = 'emotion';
const SCREENSHOT_KEY = 'screenshots';
const TOUCHPOINT_KEY = 'touchpoint';
const EMO_COLORS = ['#f43f5e', '#f97316', '#eab308', '#84cc16', '#22c55e']; // 1..5 low→high

// Brand theme color roles (each optional — falls back to the app token).
// stageText has no direct token: it maps to the dedicated --cj-stage-text var.
const THEME_ROLES = ['bg', 'stageBg', 'stageText', 'stepBg', 'labelBg', 'labelText', 'cellBg', 'text', 'border', 'borderSoft', 'accent'];
const ROLE_FALLBACK_TOKEN = {
  bg: '--bg', stageBg: '--panel-3', stepBg: '--panel', labelBg: '--panel-2', cellBg: '--cell',
  labelText: '--text-3', text: '--text-2', border: '--border', borderSoft: '--border-soft', accent: '--accent',
};
const BRAND_THEME_HEX = /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;

// ─── State ────────────────────────────────────────────────────────────────────
const state = {
  categories: [],
  personas: [],
  brandThemes: [],
  activeCategory: 0,
  activeJourney: 0,
  sidebarWidth: 220,
  theme: 'light',   // 'light' | 'dark' | 'auto'
  nextId: 1,
};

function uid() { return state.nextId++; }

function freshCells() {
  const c = {};
  SLICES.forEach(s => c[s.key] = (s.key === EMOTION_KEY) ? null : []);
  return c;
}
function newStep(name) { return { id: uid(), name, cells: freshCells() }; }
function newStage(name) { return { id: uid(), name, steps: [newStep('Step 1')] }; }
function newJourney(title, personaId) {
  return { id: uid(), personaId: personaId ?? null, brandThemeId: null, title, description: '', expectations: '', stages: [newStage('Stage 1')] };
}
function newCategory(name) { return { id: uid(), name, journeys: [], touchpoints: [] }; }
function newTouchpointItem(name) { return { id: uid(), name }; }
function newPersona(name) {
  return { id: uid(), name, role: '', description: '', goals: [], needs: [], frustrations: [], quote: '' };
}
function normStrList(v) {
  if (Array.isArray(v)) return v.map(x => String(x).trim()).filter(Boolean);
  if (typeof v === 'string' && v.trim()) return [v.trim()];
  return null;
}
function normalizePersona(p) {
  if (!p || typeof p !== 'object') return p;
  if (typeof p.name !== 'string') p.name = '';
  if (typeof p.role !== 'string') p.role = '';
  if (typeof p.description !== 'string') p.description = '';
  if (typeof p.quote !== 'string') p.quote = '';
  const g = normStrList(p.goals);       p.goals = g || [];
  const n = normStrList(p.needs);       p.needs = n || [];
  const f = normStrList(p.frustrations); p.frustrations = f || [];
  return p;
}

function currentCategory() { return state.categories[state.activeCategory] ?? null; }
function currentJourney() { return currentCategory()?.journeys[state.activeJourney] ?? null; }
function personaName(id) { return state.personas.find(p => p.id === id)?.name ?? '—'; }
function currentTouchpoints() { return currentCategory()?.touchpoints ?? []; }
function tpName(id) { return currentTouchpoints().find(t => t.id === id)?.name ?? null; }
function elementText(el, key) {
  if (key === TOUCHPOINT_KEY && el.tpId != null) return tpName(el.tpId) ?? (el.text || '');
  return el.text;
}
function tpFindOrCreate(cat, name) {
  const nm = String(name ?? '').trim(); if (!nm) return null;
  if (!Array.isArray(cat.touchpoints)) cat.touchpoints = [];
  let t = cat.touchpoints.find(x => x.name.trim().toLowerCase() === nm.toLowerCase());
  if (!t) { t = newTouchpointItem(nm); cat.touchpoints.push(t); }
  return t;
}

function ensureActiveIndicesValid() {
  if (state.categories.length === 0) return;
  state.activeCategory = Math.max(0, Math.min(state.activeCategory, state.categories.length - 1));
  const cat = currentCategory();
  if (cat) state.activeJourney = Math.max(0, Math.min(state.activeJourney, cat.journeys.length - 1));
}

function findStage(stageId) {
  const j = currentJourney(); if (!j) return null;
  for (let si = 0; si < j.stages.length; si++) {
    if (j.stages[si].id === stageId) return { stage: j.stages[si], stageIndex: si };
  }
  return null;
}
function findStep(stepId) {
  const j = currentJourney(); if (!j) return null;
  for (let si = 0; si < j.stages.length; si++) {
    const st = j.stages[si];
    for (let ti = 0; ti < st.steps.length; ti++) {
      if (st.steps[ti].id === stepId) return { stage: st, step: st.steps[ti], stageIndex: si, stepIndex: ti };
    }
  }
  return null;
}

// ─── Theme ────────────────────────────────────────────────────────────────────
const THEME_ORDER = ['light', 'dark', 'auto'];
const THEME_ICON = { light: '☀', dark: '☾', auto: '◐' };
const THEME_LABEL = { light: 'Light theme', dark: 'Dark theme', auto: 'Auto (follow system)' };
let _mqListener = null;

function resolveTheme() {
  if (state.theme === 'auto') {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  return state.theme;
}
function applyTheme() {
  const resolved = resolveTheme();
  document.documentElement.setAttribute('data-theme', resolved);
  const btn = document.getElementById('btn-theme');
  if (btn) {
    btn.textContent = THEME_ICON[state.theme] || '☀';
    btn.setAttribute('aria-label', THEME_LABEL[state.theme]);
    btn.title = THEME_LABEL[state.theme];
  }
  // react to system changes only in auto
  if (_mqListener) { window.matchMedia('(prefers-color-scheme: dark)').removeEventListener('change', _mqListener); _mqListener = null; }
  if (state.theme === 'auto' && window.matchMedia) {
    _mqListener = () => applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', _mqListener);
  }
}
function toggleTheme() {
  const idx = THEME_ORDER.indexOf(state.theme);
  state.theme = THEME_ORDER[(idx + 1) % THEME_ORDER.length];
  save(); applyTheme();
}

// ─── Brand themes (per-journey export palettes) ──────────────────────────────
function normalizeBrandThemeColors(colors) {
  const out = {};
  if (colors && typeof colors === 'object') {
    THEME_ROLES.forEach(r => {
      const v = colors[r];
      if (typeof v === 'string' && BRAND_THEME_HEX.test(v.trim())) out[r] = v.trim();
    });
  }
  return out;
}
function normalizeBrandTheme(t) {
  if (!t || typeof t !== 'object' || typeof t.name !== 'string' || !t.name.trim()) return null;
  return { id: t.id, name: t.name.trim(), colors: normalizeBrandThemeColors(t.colors) };
}
function currentBrandTheme() {
  const j = currentJourney(); if (!j || j.brandThemeId == null) return null;
  return state.brandThemes.find(t => t.id === j.brandThemeId) ?? null;
}
function applyBrandThemeToGrid() {
  const scroller = document.getElementById('grid-scroll'); if (!scroller) return;
  const t = currentBrandTheme();
  THEME_ROLES.forEach(role => {
    const prop = role === 'stageText' ? '--cj-stage-text' : ROLE_FALLBACK_TOKEN[role];
    if (t && t.colors[role]) scroller.style.setProperty(prop, t.colors[role]);
    else scroller.style.removeProperty(prop);
  });
}
function setJourneyBrandTheme(themeId) {
  const j = currentJourney(); if (!j) return;
  j.brandThemeId = themeId ?? null;
  save(); renderJourneyMeta(); renderThemeList(); renderGrid();
}
function removeBrandTheme(i) {
  const t = state.brandThemes[i]; if (!t) return;
  state.brandThemes.splice(i, 1);
  state.categories.forEach(cat => (cat.journeys || []).forEach(j => { if (j.brandThemeId === t.id) j.brandThemeId = null; }));
  save(); render();
}
function importBrandThemes(data) {
  // tolerant shapes: full contract {kind:'themes', themes:[...]}, {themes:[...]}, or a bare array
  const list = Array.isArray(data) ? data : (Array.isArray(data.themes) ? data.themes : []);
  let added = 0, updated = 0;
  const seen = new Set();
  list.forEach(src => {
    if (!src || typeof src !== 'object' || typeof src.name !== 'string' || !src.name.trim()) return;
    const name = src.name.trim();
    const key = name.toLowerCase();
    if (seen.has(key)) return; // duplicate names in one file — first wins
    seen.add(key);
    const colors = normalizeBrandThemeColors(src.colors);
    let t = state.brandThemes.find(x => x.name.trim().toLowerCase() === key);
    if (!t) { t = { id: uid(), name, colors: {} }; state.brandThemes.push(t); added++; }
    else updated++;
    // per-key merge: only the keys present in the file overwrite
    Object.keys(colors).forEach(k => { t.colors[k] = colors[k]; });
  });
  save(); render();
  return { added, updated };
}
function exportBrandThemes() {
  const data = { version: 1, kind: 'themes', app: 'customer-journey',
    themes: state.brandThemes.map(t => ({ name: t.name, colors: { ...t.colors } })) };
  downloadJson(data, 'customer-journey-themes.json');
  flashToast('✓ Themes exported');
}

// ─── Persistence ──────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { showStorageError(); }
}

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    Object.assign(state, parsed);
    if (!state.theme) state.theme = 'light';
    // normalize any missing cells/slices on loaded data
    state.categories.forEach(cat => cat.journeys.forEach(j => {
      if (j.brandThemeId == null) j.brandThemeId = null;
      j.stages.forEach(st => st.steps.forEach(step => {
        const c = step.cells || (step.cells = {});
        SLICES.forEach(s => { if (!(s.key in c)) c[s.key] = (s.key === EMOTION_KEY) ? null : []; });
      }));
    }));
    // touchpoint library migration: free-text elements become per-category library items
    state.categories.forEach(cat => migrateCategoryTouchpoints(cat));
    if (!Array.isArray(state.personas)) state.personas = [];
    state.personas.forEach(p => normalizePersona(p));
    if (!Array.isArray(state.brandThemes)) state.brandThemes = [];
    state.brandThemes = state.brandThemes.map(t => normalizeBrandTheme(t)).filter(Boolean);
  } catch (e) { /* corrupt — keep defaults */ }
}

let _storageErrTimer = null;
function showStorageError() {
  let el = document.getElementById('storage-error');
  if (!el) { el = document.createElement('div'); el.id = 'storage-error'; document.body.appendChild(el); }
  el.textContent = "Couldn't save — localStorage may be full. Try removing unused data.";
  clearTimeout(_storageErrTimer);
  _storageErrTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
  el.style.display = '';
}

// ─── Category CRUD ────────────────────────────────────────────────────────────
function createCategory(name) {
  const cat = newCategory(name || `Category ${state.categories.length + 1}`);
  state.categories.push(cat);
  state.activeCategory = state.categories.length - 1;
  state.activeJourney = 0;
  _pendingRename = 'category';
  save(); render();
}
function switchCategory(i) { state.activeCategory = i; state.activeJourney = 0; save(); render(); }
function renameCategory(i, name) {
  const cat = state.categories[i]; if (!cat) return;
  cat.name = name.trim() || `Category ${i + 1}`;
  save(); renderCategoryList();
}
function removeCategory(i) {
  const cat = state.categories[i]; if (!cat) return;
  cat.journeys.forEach(j => deleteShotIds(collectJourneyShotIds(j)));
  state.categories.splice(i, 1);
  if (state.categories.length === 0) state.categories.push(newCategory('Cash loan'));
  ensureActiveIndicesValid();
  save(); render();
}
function moveCategory(from, to) {
  if (from === to || to < 0 || to >= state.categories.length) return;
  const [it] = state.categories.splice(from, 1);
  state.categories.splice(to, 0, it);
  if (state.activeCategory === from) state.activeCategory = to;
  save(); render();
}

// ─── Persona CRUD ─────────────────────────────────────────────────────────────
function createPersona(name) {
  state.personas.push(newPersona(name || `Persona ${state.personas.length + 1}`));
  _pendingRename = 'persona';
  save(); render();
}
function renamePersona(i, name) {
  const p = state.personas[i]; if (!p) return;
  p.name = name.trim() || `Persona ${i + 1}`;
  save(); renderPersonaList(); renderJourneyMeta();
}
function removePersona(i) {
  state.personas.splice(i, 1);
  save(); render();
}
function movePersona(from, to) {
  if (from === to || to < 0 || to >= state.personas.length) return;
  const [it] = state.personas.splice(from, 1);
  state.personas.splice(to, 0, it);
  save(); render();
}

// ─── Journey CRUD ─────────────────────────────────────────────────────────────
function createJourney(title) {
  let cat = currentCategory();
  if (!cat) { createCategory('Cash loan'); cat = currentCategory(); }
  const personaId = state.personas[0]?.id ?? null;
  cat.journeys.push(newJourney(title || `Journey ${cat.journeys.length + 1}`, personaId));
  state.activeJourney = cat.journeys.length - 1;
  _pendingRename = 'journey';
  save(); render();
}
function switchJourney(i) { state.activeJourney = i; _activeShotsCell = null; save(); render(); }
function removeJourney(i) {
  const cat = currentCategory(); if (!cat) return;
  if (cat.journeys[i]) deleteShotIds(collectJourneyShotIds(cat.journeys[i]));
  cat.journeys.splice(i, 1);
  ensureActiveIndicesValid();
  save(); render();
}
function moveJourney(from, to) {
  const cat = currentCategory(); if (!cat) return;
  if (from === to || to < 0 || to >= cat.journeys.length) return;
  const [it] = cat.journeys.splice(from, 1);
  cat.journeys.splice(to, 0, it);
  save(); render();
}
function setJourneyField(field, value) {
  const j = currentJourney(); if (!j) return;
  j[field] = value;
  save();
  if (field === 'title') renderSidebarJourneyTitle();
}

// ─── Stage CRUD ───────────────────────────────────────────────────────────────
function addStage() {
  const j = currentJourney(); if (!j) return;
  const st = newStage(`Stage ${j.stages.length + 1}`);
  j.stages.push(st);
  _pendingStageRename = st.id;
  save(); renderGrid();
}
function renameStage(stageId, name) {
  const r = findStage(stageId); if (!r) return;
  r.stage.name = name.trim() || `Stage ${r.stageIndex + 1}`;
  save(); renderGrid();
}
function removeStage(stageId) {
  const j = currentJourney(); if (!j) return;
  const idx = j.stages.findIndex(s => s.id === stageId); if (idx < 0) return;

    const list = (step.cells || {})[TOUCHPOINT_KEY];

// ─── Image store (IndexedDB — blobs never touch localStorage) ────────────────
const IMAGES_DB_NAME = 'ux-customer-journey-images';
let _imagesDb = null;
function openImagesDb() {
  if (_imagesDb) return Promise.resolve(_imagesDb);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IMAGES_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('images', { keyPath: 'id' }); };
    req.onsuccess = () => { _imagesDb = req.result; resolve(_imagesDb); };
    req.onerror = () => reject(req.error || new Error('IndexedDB unavailable'));
  });
}
function dbPutImage(rec) {
  return openImagesDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('images', 'readwrite');
    tx.objectStore('images').put(rec);
    tx.oncomplete = () => resolve(rec);
    tx.onerror = () => reject(tx.error);
  }));
}
function dbGetImage(id) {
  return openImagesDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('images', 'readonly');
    const rq = tx.objectStore('images').get(id);
    rq.onsuccess = () => resolve(rq.result || null);
    rq.onerror = () => reject(rq.error);
  }));
}
function dbDeleteImage(id) {
  return openImagesDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('images', 'readwrite');
    tx.objectStore('images').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}
function blobToDataURL(blob) {

    r.onerror = () => reject(r.error);

  });
}
function dataURLToBlob(dataURL) {
  try {
    const comma = String(dataURL).indexOf(',');
    if (comma < 0) return null;
    const head = String(dataURL).slice(0, comma);
    const mime = (/:(.*?);/.exec(head) || [])[1] || 'image/png';
    const bin = atob(String(dataURL).slice(comma + 1));
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  } catch (e) { return null; }
}
function imgElementFromBlob(blob) {

    img.onload = () => resolve(img);
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
function imageDims(blob) {

    return createImageBitmap(blob).then(bm => {
      const d = { w: bm.width, h: bm.height };
      if (bm.close) bm.close();
      return d;
    }).catch(() => imgElementFromBlob(blob).then(img => ({ w: img.naturalWidth, h: img.naturalHeight })));
  }
  return imgElementFromBlob(blob).then(img => ({ w: img.naturalWidth, h: img.naturalHeight }));
}

// object-URL cache for thumbnails (id → url), revoked on delete
const _objUrls = new Map();
function shotObjectUrl(id) {
  if (_objUrls.has(id)) return Promise.resolve(_objUrls.get(id));
  return dbGetImage(id).then(rec => {
    if (!rec || !rec.blob) return null;
    const url = URL.createObjectURL(rec.blob);

  }).catch(() => null);
}

}

// ─── Screenshots CRUD ────────────────────────────────────────────────────────
let _activeShotsCell = null;   // last clicked Screenshots cell = paste target

async function addScreenshotsFromFiles(stepId, files) {
  const r = findStep(stepId); if (!r) return;
  const imgs = Array.from(files || []).filter(f => f && f.type && f.type.startsWith('image/'));
  if (imgs.length === 0) { flashToast('No image files found'); return; }
  let stored = 0, failed = 0;
  for (const f of imgs) {
    try {
      const dims = await imageDims(f);
      if (!dims.w || !dims.h) throw new Error('unreadable image');
      const id = uid();
      await dbPutImage({ id, blob: f, type: f.type, name: f.name || 'screenshot', w: dims.w, h: dims.h });
      r.step.cells[SCREENSHOT_KEY].push({ id, w: dims.w, h: dims.h });
      stored++;
    } catch (e) { console.error(e); failed++; }
  }
  if (stored > 0) { save(); renderGrid(); }
  if (failed > 0) flashToast("✗ Couldn't store " + failed + (failed === 1 ? ' image' : ' images'));
}
async function removeScreenshot(stepId, shotId) {
  const r = findStep(stepId); if (!r) return;

function onPasteImage(e) {

  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length === 0) return;
  if (!_activeShotsCell) { flashToast('Click a Screenshots cell first'); return; }
  e.preventDefault();

  });
  input.addEventListener('blur', () => finish(input.value));
}

let _tpPicker = null;          // live picker { el, onKey, onDoc } — torn down by renderGrid()
let _tpManagerRefresh = null;  // renderList of an open manager (refreshed by import)

function closeTpPicker() {

// Rebuild a single Touchpoints cell in place (the picker survives — multi-add)
function refreshTpCell(stepId) {

  if (!cell) return;

function openTpPicker(anchor, step) {
  closeTpPicker();
  const cat = currentCategory(); if (!cat) return;
  const pop = document.createElement('div');
  pop.className = 'tp-picker';
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', 'Pick touchpoints');
  document.body.appendChild(pop);
  const rect = anchor.getBoundingClientRect();
  const w = pop.offsetWidth || 220;
  pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - w - 8)) + 'px';
  pop.style.top = Math.min(rect.bottom + 4, window.innerHeight - 60) + 'px';

  let filterRaw = '';
  let adding = false;

  function renderPicker() {
    pop.textContent = '';
    const filter = filterRaw.trim().toLowerCase();
    const present = new Set((step.cells[TOUCHPOINT_KEY] || []).map(e => e.tpId));
    const items = cat.touchpoints.filter(t => t.name.toLowerCase().includes(filter));

    if (cat.touchpoints.length > 8) {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'tp-filter'; inp.value = filterRaw;
      inp.placeholder = 'Filter…';
      inp.setAttribute('aria-label', 'Filter touchpoints');
      inp.addEventListener('input', () => {
        filterRaw = inp.value;
        renderPicker();
        const f2 = pop.querySelector('.tp-filter');
        if (f2) { f2.focus(); f2.setSelectionRange(f2.value.length, f2.value.length); }
      });
      pop.appendChild(inp);
    }
    if (items.length === 0) {
      const none = document.createElement('div');
      none.className = 'tp-none';
      none.textContent = cat.touchpoints.length === 0 ? 'No touchpoints yet — add one below.' : 'No match';
      pop.appendChild(none);
    }
    items.forEach(t => {
      const isPresent = present.has(t.id);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tp-item' + (isPresent ? ' present' : '');
      const chk = document.createElement('span'); chk.className = 'tp-check'; chk.textContent = '✓'; chk.setAttribute('aria-hidden', 'true');
      const nm = document.createElement('span'); nm.className = 'tp-name'; nm.textContent = t.name;
      btn.setAttribute('aria-label', `${isPresent ? 'Remove' : 'Add'} ${t.name}`);
      btn.title = isPresent ? 'Remove from this step' : 'Add to this step';
      btn.appendChild(chk); btn.appendChild(nm);
      btn.addEventListener('click', ev => {
        ev.stopPropagation();
        if (isPresent) removeTouchpointElement(step.id, t.id);
        else addTouchpointElement(step.id, t.id);
        renderPicker(); // refresh presence marks — stays open for multi-add
      });
      pop.appendChild(btn);
    });
    const sep = document.createElement('div'); sep.className = 'tp-sep'; pop.appendChild(sep);
    if (adding) {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'tp-input'; inp.value = filterRaw;
      inp.placeholder = 'New touchpoint name…';
      inp.setAttribute('aria-label', 'New touchpoint name');
      inp.addEventListener('keydown', ev => {
        ev.stopPropagation();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          const item = addTouchpoint(inp.value);
          if (item && String(inp.value).trim()) { save(); addTouchpointElement(step.id, item.id); }
          adding = false; renderPicker();
        }
        if (ev.key === 'Escape') { adding = false; renderPicker(); }
      });
      pop.appendChild(inp);
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
    } else {
      const newBtn = document.createElement('button');
      newBtn.type = 'button'; newBtn.className = 'tp-extra'; newBtn.textContent = '＋ New touchpoint…';
      newBtn.addEventListener('click', ev => { ev.stopPropagation(); adding = true; renderPicker(); });
      pop.appendChild(newBtn);
      const mgrBtn = document.createElement('button');
      mgrBtn.type = 'button'; mgrBtn.className = 'tp-extra'; mgrBtn.textContent = '⚙ Manage list…';
      mgrBtn.addEventListener('click', ev => { ev.stopPropagation(); closeTpPicker(); openTouchpointManager(); });
      pop.appendChild(mgrBtn);
    }
  }

  function onKey(e) {
    // Escape inside the new-name input backs out to the list, handled by the input itself
    if (e.key === 'Escape' && !(e.target.classList && e.target.classList.contains('tp-input'))) {
      e.stopPropagation(); closeTpPicker(); return;
    }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const btns = Array.from(pop.querySelectorAll('button'));
    if (btns.length === 0) return;
    e.preventDefault();
    const idx = btns.indexOf(document.activeElement);
    const next = e.key === 'ArrowDown' ? (idx + 1) % btns.length : (idx - 1 + btns.length) % btns.length;
    btns[idx >= 0 ? next : 0].focus();
  }
  function onDoc(e) { if (!pop.contains(e.target)) closeTpPicker(); }
  document.addEventListener('keydown', onKey, true);
  document.addEventListener('mousedown', onDoc, true);

  _tpPicker = { el: pop, onKey, onDoc };
  renderPicker();
  const first = pop.querySelector('.tp-filter') || pop.querySelector('.tp-item');
  if (first) first.focus();
}

let _tmDrag = null;
function openTouchpointManager() {
  const cat = currentCategory(); if (!cat) return;
  closeTpPicker();
  const prevFocus = document.activeElement;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');

  const card = document.createElement('div');

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button'; closeBtn.className = 'tm-close'; closeBtn.textContent = '×';

  closeBtn.title = 'Close (Escape)';
  card.appendChild(closeBtn);

  const h = document.createElement('h2'); h.textContent = 'Touchpoints'; card.appendChild(h);
  const sub = document.createElement('div'); sub.className = 'tm-sub'; sub.textContent = cat.name; card.appendChild(sub);

  const toolbar = document.createElement('div'); toolbar.className = 'tm-toolbar';
  const addInput = document.createElement('input');
  addInput.type = 'text'; addInput.className = 'tm-add-input'; addInput.placeholder = 'New touchpoint…';
  addInput.setAttribute('aria-label', 'New touchpoint name');
  const addBtn = document.createElement('button');
  addBtn.type = 'button'; addBtn.className = 'btn btn-primary btn-sm'; addBtn.textContent = 'Add';
  const expBtn = document.createElement('button');
  expBtn.type = 'button'; expBtn.className = 'btn btn-ghost btn-sm'; expBtn.textContent = '↧ Export';
  expBtn.title = "Export this category's touchpoints as JSON";
  expBtn.addEventListener('click', exportTouchpoints);
  const impBtn = document.createElement('button');
  impBtn.type = 'button'; impBtn.className = 'btn btn-ghost btn-sm'; impBtn.textContent = '↥ Import';
  impBtn.title = 'Import touchpoints from JSON into this category';
  impBtn.addEventListener('click', () => document.getElementById('import-file').click());
  toolbar.appendChild(addInput); toolbar.appendChild(addBtn); toolbar.appendChild(expBtn); toolbar.appendChild(impBtn);
  card.appendChild(toolbar);

  const listEl = document.createElement('ul'); listEl.className = 'tm-list';
  card.appendChild(listEl);

  function commitAdd() {
    const nm = addInput.value.trim(); if (!nm) return;
    const before = cat.touchpoints.length;
    const item = addTouchpoint(nm);
    if (!item) return;
    if (cat.touchpoints.length !== before) save();
    addInput.value = '';
    renderList(); renderGrid();
    addInput.focus();
  }
  addBtn.addEventListener('click', commitAdd);
  addInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitAdd(); } });

  function renderList() {
    listEl.textContent = '';
    if (cat.touchpoints.length === 0) {
      const li = document.createElement('li');
      li.className = 'tm-empty';
      li.textContent = 'No touchpoints yet — add the first one above.';
      listEl.appendChild(li);
      return;
    }
    cat.touchpoints.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'tm-row';
      li.draggable = true;

      const handle = document.createElement('span'); handle.className = 'tm-handle'; handle.textContent = '⠿'; handle.setAttribute('aria-hidden', 'true');
      const nameSpan = document.createElement('span'); nameSpan.className = 'tm-name'; nameSpan.textContent = t.name;
      const doRename = v => {
        const nm = String(v || '').trim();
        if (!nm || nm === t.name) return;
        renameTouchpoint(t.id, nm);
        renderList(); renderGrid();
      };
      nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(nameSpan, t.name, doRename); });

      const uses = touchpointUsage(cat, t.id);
      const count = document.createElement('span'); count.className = 'tm-count'; count.textContent = `${uses}×`;
      count.title = `Used in ${uses} ${plural(uses, 'cell', 'cells')}`;

      const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.className = 'tm-edit'; editBtn.textContent = '✎';
      editBtn.setAttribute('aria-label', `Rename ${t.name}`); editBtn.title = 'Rename';
      editBtn.addEventListener('click', e => { e.stopPropagation(); startEdit(nameSpan, t.name, doRename); });

      const removeBtn = document.createElement('button'); removeBtn.type = 'button'; removeBtn.className = 'tm-remove'; removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', `Remove ${t.name}`); removeBtn.title = 'Remove';
      removeBtn.addEventListener('click', e => {
        e.stopPropagation();
        removeTouchpoint(t.id); // confirm + cascade when in use
        renderList(); renderGrid();
      });

      li.addEventListener('dragstart', e => { _tmDrag = { from: i }; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); });
      li.addEventListener('dragend', () => { _tmDrag = null; listEl.querySelectorAll('.tm-row').forEach(el => el.classList.remove('dragging', 'drag-over-above', 'drag-over-below')); });
      li.addEventListener('dragover', e => {
        if (_tmDrag == null) return;
        e.preventDefault();
        const rect = li.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        listEl.querySelectorAll('.tm-row').forEach(el => el.classList.remove('drag-over-above', 'drag-over-below'));
        li.classList.add(e.clientY < mid ? 'drag-over-above' : 'drag-over-below');
      });
      li.addEventListener('drop', e => {
        if (_tmDrag == null) return;
        e.preventDefault(); e.stopPropagation();
        const rect = li.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        let to = i + (e.clientY >= mid ? 1 : 0);
        if (_tmDrag.from < to) to--;
        moveTouchpoint(_tmDrag.from, to);
        renderList();
      });

      li.appendChild(handle); li.appendChild(nameSpan); li.appendChild(count); li.appendChild(editBtn); li.appendChild(removeBtn);
      listEl.appendChild(li);
    });
  }

  function closeIt() {
    overlay.remove();
    document.removeEventListener('keydown', onKey, true);
    _tpManagerRefresh = null;
    if (prevFocus && prevFocus.focus) prevFocus.focus();
  }
  function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); closeIt(); } }
  closeBtn.addEventListener('click', closeIt);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeIt(); });
  document.addEventListener('keydown', onKey, true);

  overlay.appendChild(card);
  document.body.appendChild(overlay);
  _tpManagerRefresh = renderList;
  renderList();
  addInput.focus();
}

// generic sidebar item builder
function mkSidebarItem({ name, active, sub, draggable, card, onActivate, onRename, onRemove, onMove, dragKind }) {
  const li = document.createElement('li');
  li.className = 'sb-item' + (active ? ' active' : '') + (card ? ' sb-card' : '');
  li.draggable = !!draggable;

  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⠿';
  handle.setAttribute('aria-hidden', 'true');
  handle.addEventListener('mousedown', e => e.stopPropagation());

  const main = document.createElement('div');
  main.className = 'item-main';
  const nameSpan = document.createElement('span');
  nameSpan.className = 'item-name';
  nameSpan.textContent = name;
  if (onRename) nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(nameSpan, name, onRename); });
  main.appendChild(nameSpan);
  const subs = Array.isArray(sub) ? sub : (sub ? [sub] : []);
  subs.forEach(s => {
    const subSpan = document.createElement('span');
    subSpan.className = 'item-sub';
    subSpan.textContent = s;
    main.appendChild(subSpan);
  });

  let editBtn = null;
  if (onRename) {
    editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'item-edit';
    editBtn.textContent = '✎';
    editBtn.setAttribute('aria-label', 'Rename');
    editBtn.title = 'Rename';
    editBtn.addEventListener('click', e => { e.stopPropagation(); startEdit(nameSpan, name, onRename); });
  }

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'item-remove';
  removeBtn.textContent = '×';
  removeBtn.setAttribute('aria-label', 'Remove');
  removeBtn.title = 'Remove';
  removeBtn.addEventListener('click', e => { e.stopPropagation(); onRemove(); });

  // drag reorder (draggable lists only)
  if (draggable) {
    li.addEventListener('dragstart', e => {
      sidebarDrag = { kind: dragKind, from: Array.from(li.parentElement.children).indexOf(li) };
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
    });
    li.addEventListener('dragend', () => {
      sidebarDrag = null;
      li.parentElement.querySelectorAll('.sb-item').forEach(el => el.classList.remove('dragging', 'drag-over-above', 'drag-over-below'));
    });
    li.addEventListener('dragover', e => {
      if (!sidebarDrag || sidebarDrag.kind !== dragKind) return;
      e.preventDefault();
      const rect = li.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      li.parentElement.querySelectorAll('.sb-item').forEach(el => el.classList.remove('drag-over-above', 'drag-over-below'));
      li.classList.add(e.clientY < mid ? 'drag-over-above' : 'drag-over-below');
    });
    li.addEventListener('drop', e => {
      if (!sidebarDrag || sidebarDrag.kind !== dragKind) return;
      e.preventDefault(); e.stopPropagation();
      const rect = li.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      let to = Array.from(li.parentElement.children).indexOf(li);
      if (e.clientY >= mid) to++;
      if (sidebarDrag.from < to) to--;
      onMove(sidebarDrag.from, to);
    });
  }

  if (draggable) li.appendChild(handle);
  li.appendChild(main);
  if (editBtn) li.appendChild(editBtn);
  li.appendChild(removeBtn);
  li.addEventListener('click', () => onActivate());
  return li;
}

}

function mkField(label, value, onChange) {

// ─── Grid rendering ───────────────────────────────────────────────────────────
function rowWrap() {
  const r = document.createElement('div');
  r.className = 'grow';
  r.setAttribute('role', 'row');

}

function renderGrid() {
  applyBrandThemeToGrid();
  closeTpPicker(); // a full grid rebuild invalidates the picker's anchor/step
  const j = currentJourney();
  gridEl.innerHTML = '';
  if (!j) return;

  const flat = [];
  j.stages.forEach((st, si) => st.steps.forEach((step, ti) => flat.push({ stageIndex: si, stepIndex: ti, stage: st, step })));
  const N = flat.length;
  stepCountEl.textContent = `${N} ${plural(N, 'step', 'steps')}`;

  gridEl.setAttribute('aria-label', `${j.title} — grid`);

  if (N === 0) { gridEl.style.display = 'none'; return; }

  gridEl.style.gridTemplateColumns = `${LABEL_COL_W}px repeat(${N}, ${STEP_COL_W}px)`;

    let firstFlat = -1, lastFlat = -1;

    place(cell, STAGE_ROW, startCol, endCol);

    const handle = document.createElement('span'); handle.className = 'drag-handle'; handle.textContent = '⠿'; handle.setAttribute('aria-hidden', 'true');
    const nameSpan = document.createElement('span'); nameSpan.className = 'stage-name'; nameSpan.textContent = st.name;
    nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(nameSpan, st.name, v => renameStage(st.id, v)); });
    const addStepBtn = document.createElement('button'); addStepBtn.className = 'stage-add-step'; addStepBtn.type = 'button';
    addStepBtn.textContent = '+ step'; addStepBtn.setAttribute('aria-label', `Add step to ${st.name}`); addStepBtn.title = 'Add step to stage';
    addStepBtn.addEventListener('click', e => { e.stopPropagation(); addStep(st.id); });
    const removeStageBtn = document.createElement('button'); removeStageBtn.type = 'button'; removeStageBtn.className = 'stage-remove';
    removeStageBtn.textContent = '×'; removeStageBtn.setAttribute('aria-label', `Remove stage ${st.name}`); removeStageBtn.title = 'Remove stage';
    removeStageBtn.addEventListener('click', e => { e.stopPropagation(); removeStage(st.id); });

    const removeBtn = document.createElement('button'); removeBtn.type = 'button'; removeBtn.className = 'step-remove';

    cell.addEventListener('dragover', e => {

      if (slice.key === TOUCHPOINT_KEY) cellEl.dataset.stepId = step.id;
      cellEl.setAttribute('role', 'gridcell');
      cellEl.setAttribute('aria-label', cellAriaLabel(slice, step));

      else cellEl.appendChild(buildCellElements(step, slice.key));

function cellAriaLabel(slice, step) {
  let detail;
  if (slice.key === EMOTION_KEY) {
    const v = step.cells[EMOTION_KEY];
    detail = (v != null) ? `emotion ${v} of 5` : 'emotion not rated';
  } else if (slice.key === SCREENSHOT_KEY) {
    const l = step.cells[SCREENSHOT_KEY] || [];
    detail = l.length ? `${l.length} ${plural(l.length, 'screenshot', 'screenshots')}` : 'no screenshots';
  } else {
    const list = step.cells[slice.key] || [];
    detail = list.map(e => elementText(e, slice.key)).filter(Boolean).join('; ') || 'empty';
  }
  return `${slice.label}, ${step.name}: ${detail}`;
}

let gridDrag = null;

    row.addEventListener('dragend', () => { elementDrag = null; row.classList.remove('dragging'); wrap.querySelectorAll('.element').forEach(e => e.classList.remove('dragging')); });
    row.addEventListener('dragover', ev => {
      if (!elementDrag || elementDrag.stepId !== step.id || elementDrag.slice !== slice) return;
      ev.preventDefault(); ev.stopPropagation();
    });
    row.addEventListener('drop', ev => {
      if (!elementDrag || elementDrag.stepId !== step.id || elementDrag.slice !== slice) return;
      ev.preventDefault(); ev.stopPropagation();
      moveElement(elementDrag.stepId, elementDrag.slice, elementDrag.from, idx);
    });

    row.appendChild(handle); row.appendChild(text); row.appendChild(rm);
    wrap.appendChild(row);

    if (!isTp && _pendingElementEdit && _pendingElementEdit.stepId === step.id && _pendingElementEdit.slice === slice && _pendingElementEdit.elementId === el.id) {
      _pendingElementEdit = null;

    else addElement(step.id, slice);

  return wrap;
}

function buildEmotion(step) {
